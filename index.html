<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101816">
<title>Perheen ilmoitustaulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<!-- Apps Script -osoite on tiedostossa config.js (yhteinen ilmoitustaululle ja listoille) -->
<script src="config.js"></script>
<script>if(typeof BACKEND_URL==="undefined")var BACKEND_URL="";</script>
<style>
/* Layout: wall-board kiosk — clock + weather band, then week | notes | bus departures, quick links as footer. */
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#17302a; --muted:#5d716b; --line:#d5ddd9;
  --accent:#1f6f5c; --accent-ink:#ffffff; --today:#e2efe9; --danger:#a33a2c; --warn:#a86a00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --n1:#f6e39a; --n2:#bfe0d2; --n3:#f3c4b8; --n4:#c9d3f2; --n5:#e3cbec; --n6:#d9e6a8; --note-ink:#1d2622;
  --line-bg:#17302a; --line-ink:#f6e39a;
  --alert-bg:#fbe7c2; --alert-ink:#5e3c00; --rain:#2f6fae; --cold:#5b9fe0; --warm:#e8a33d; --night:rgba(23,48,42,.05);
  --panel-a:rgba(251,252,251,.86); --scrim:rgba(238,241,239,.22); --fx-rgb:70,105,125; --glow-rgb:255,196,90;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101816; --panel:#17221f; --ink:#e4ece8; --muted:#93a8a1; --line:#2a3a35;
  --accent:#5cc3a6; --accent-ink:#0c1a16; --today:#1d332c; --danger:#ef8a7a; --warn:#e8b25a;
  --n1:#d9c46e; --n2:#8fc4ad; --n3:#dc9d8e; --n4:#9eaee0; --n5:#c3a2d0; --n6:#b6c97c; --note-ink:#141a18;
  --line-bg:#d9c46e; --line-ink:#141a18;
  --alert-bg:#3b2b10; --alert-ink:#f2c77d; --rain:#86bdf0; --cold:#6aaef0; --warm:#f0b052; --night:rgba(255,255,255,.04);
  --panel-a:rgba(23,34,31,.82); --scrim:rgba(8,14,12,.45); --fx-rgb:205,222,232; --glow-rgb:255,210,130;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:12px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top band */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(48px,6.6vw,96px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:.3em;color:var(--muted);font-weight:500;margin-left:.15em;letter-spacing:0}
.date{display:flex;flex-direction:column;gap:3px;min-width:0}
.date .day{font-family:var(--display);font-weight:500;font-size:clamp(18px,2.2vw,28px)}
.date .week{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.weather{display:flex;align-items:center;gap:12px;padding:4px 8px 4px 18px;border:none;border-left:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-width:0}
.weather:hover .wtemp,.weather:focus-visible .wtemp{color:var(--accent)}
.walert{border:none;font-family:inherit;cursor:pointer;margin-top:6px;text-align:left;display:inline-flex;align-items:center;gap:6px;background:var(--alert-bg);color:var(--alert-ink);font-size:13px;font-weight:700;line-height:1.3;border-radius:10px;padding:6px 10px;max-width:340px}
.walert.hi{background:var(--danger);color:#fff}
.wmorn{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line);max-width:300px;min-width:0}
.wmi{font-size:28px;line-height:1}
.wmt{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);line-height:1.35}
.wmt b{color:var(--ink);font-size:14px}
@media (max-width:1350px){ .weather .hours{display:none} }
@media (max-width:1100px){ .wmt span{display:none} .wmorn{max-width:170px} }
.walert small{font-weight:400;opacity:.8;white-space:nowrap}
.wnow{display:flex;align-items:center;gap:8px}
.wicon{font-size:40px;line-height:1}
.wtemp{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.wmeta{font-size:13px;color:var(--muted);line-height:1.45}
.wmeta b{color:var(--ink);font-weight:700}
.hours{display:flex;gap:12px}
.hr{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:2px}
.hr .i{font-size:20px}
.hr .tt{color:var(--ink);font-weight:700;font-size:15px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.icon{width:44px;padding:0;justify-content:center}
.btn svg{width:20px;height:20px}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr .85fr;gap:12px}
.col{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr);gap:12px;min-height:0;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ph .sp{flex:1}
.nav{border:none;background:none;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:20px}
.nav:hover{background:var(--today)}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scroll{overflow:auto;min-height:0;flex:1;padding:0 14px 12px}

.dayrow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 6px;border-top:1px solid var(--line);align-items:start}
.dayrow:first-child{border-top:none}
.dayrow.today{background:var(--today);border-radius:10px;border-top-color:transparent}
.dayrow.today + .dayrow{border-top-color:transparent}
.dayrow.past{opacity:.5}
.dname{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.dnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.evs{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev{display:flex;align-items:baseline;gap:8px;background:none;border:none;text-align:left;padding:3px 0;min-width:0}
.ev .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;font-size:15px}
.ev .x{min-width:0;overflow-wrap:anywhere}
.ev .w{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;background:var(--muted)}
.dot.g{background:transparent;border:2.5px solid var(--accent);width:10px;height:10px}
.empty-day{color:var(--muted);font-size:14px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.note{background:var(--n1);color:var(--note-ink);border-radius:4px 4px 14px 4px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-height:96px;border:none;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.note .txt{font-size:17px;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap;flex:1}
.note .who{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;display:flex;justify-content:space-between;gap:6px}

.deps{display:flex;flex-direction:column}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border:none;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer}
.dep:hover .dest{color:var(--accent)}
.dep-hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.bm-head{display:flex;align-items:center;gap:12px}
.bm-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.bm-t b{font-size:18px}
#bmSt{font-size:14px;color:var(--muted)}
.bm-map{height:min(56vh,520px);border-radius:12px;overflow:hidden;background:var(--today);z-index:0}
.bm-stops{display:flex;flex-direction:column;max-height:22vh;overflow:auto}
.bm-stop{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:5px 2px;font-size:14px}
.bm-stop .dot2{width:10px;height:10px;border-radius:50%;background:var(--accent);justify-self:center}
.bm-stop .t{color:var(--muted);font-variant-numeric:tabular-nums}
.bm-stop.me{font-weight:700}
.bm-stop.me .dot2{width:14px;height:14px;background:var(--warn)}
.bus-ic{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;background:var(--line-bg);color:var(--line-ink);font-family:var(--display);font-weight:700;font-size:15px;border:3px solid #fff;border-radius:999px;padding:3px 9px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.bus-ic.other{opacity:.5;font-size:12px;padding:1px 6px;border-width:2px}
.stop-ic{transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;font-size:26px;line-height:1}
.stop-ic span{font-family:var(--body);font-size:12px;font-weight:700;background:#fff;color:#17302a;border-radius:6px;padding:2px 6px;margin-top:2px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dep:first-child{border-top:none}
.lineno{background:var(--line-bg);color:var(--line-ink);font-family:var(--display);font-weight:700;font-size:17px;min-width:46px;text-align:center;padding:5px 6px;border-radius:8px;font-variant-numeric:tabular-nums}
.dest{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.dest .sname{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.when{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.when .m{font-family:var(--display);font-weight:700;font-size:20px}
.when .c{display:block;font-size:12px;color:var(--muted)}
.when .late{color:var(--warn)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* today */
.td-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:100%}
.td-item:first-child{border-top:none}
.td-time{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;min-width:66px}
.td-time small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.td-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.td-title{font-size:19px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.td-meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.td-meta .who{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--today);color:var(--ink);align-self:flex-start;letter-spacing:.02em}
.pill.now{background:var(--accent);color:var(--accent-ink)}
.td-item.past{opacity:.45}
.td-item.past .td-time{font-size:18px}
.td-item.past .td-title{font-size:15px;font-weight:400}
.allday{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.allday .ad{background:var(--today);border:none;border-radius:8px;padding:6px 10px;font-size:15px;text-align:left;display:inline-flex;align-items:center;gap:6px}
.tmrw{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.tmrw h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:700}
/* view switch + month */
.ttl{display:flex;flex-direction:column;min-width:0}
.ttl h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:none;background:none;padding:6px 10px;font-size:13px;min-height:36px;color:var(--muted)}
.ph .nav{width:32px;flex:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.month{display:grid;grid-template-columns:24px repeat(7,minmax(0,1fr));gap:3px}
.mh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0}
.wn{font-size:11px;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-variant-numeric:tabular-nums}
.mc{border:1px solid var(--line);background:none;border-radius:8px;padding:4px;min-height:54px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;overflow:hidden}
.mc .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mc.out{opacity:.35}
.mc.today{background:var(--today);border-color:var(--accent)}
.mc .it{font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;min-width:0}
.mc .it .dot{width:6px;height:6px}
.mc .it .dot.g{border-width:1.5px;width:6px;height:6px}
.mc .more{font-size:11px;color:var(--muted)}
.mc .its{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (max-width:1280px){
  .mc .its{flex-direction:row;flex-wrap:wrap;gap:4px;margin-top:2px}
  .mc .it .lbl{display:none}
  .mc .it .dot{width:8px;height:8px}
  .mc .it .dot.g{width:8px;height:8px;border-width:2px}
}
/* kids */
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.kgrp{margin-bottom:12px}
.kgrp h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:700}
.kwear{display:flex;gap:10px;align-items:flex-start;background:var(--today);border:none;border-radius:10px;padding:8px 10px;margin-bottom:6px;width:100%;text-align:left;color:var(--ink)}
.kwear .ki{font-size:22px;line-height:1.1}
.kwear .kt{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.kwear .kt b{font-size:13px;color:var(--muted);font-weight:700}
.kit{display:flex;align-items:center;gap:10px;min-height:44px;border-top:1px solid var(--line)}
.kwear + .kit,.kgrp h3 + .kit{border-top:none}
.kck{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:none;display:flex;align-items:center;justify-content:center;padding:0;color:var(--accent-ink)}
.kck svg{width:17px;height:17px;opacity:0}
.kit.done .kck{background:var(--accent);border-color:var(--accent)}
.kit.done .kck svg{opacity:1}
.ktx{flex:1;min-width:0;background:none;border:none;text-align:left;padding:8px 0;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:16px}
.ktx .kn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;color:var(--note-ink)}
.ktx .kw{overflow-wrap:anywhere}
.kit.done .ktx .kw{text-decoration:line-through;color:var(--muted)}
.ktx .rep{color:var(--muted);font-size:13px;flex:none;margin-left:auto}
.kempty{color:var(--muted);font-size:14px;margin:2px 0 4px}
.kwho{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.kwho .kn{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:var(--note-ink)}
.kcnt{font-size:12px;color:var(--muted)}
.kmore{margin-left:auto;border:none;background:none;color:var(--muted);width:34px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.kmore:hover{background:var(--today)}
.kall{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.kall .kn{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;color:var(--note-ink);flex:none}
.kah{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-bottom:4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kah .linkb{text-transform:none;letter-spacing:0}
.kall .rep{color:var(--muted);font-size:12px;flex:none}
.kall .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.kul{list-style:none;margin:0 0 4px;padding:0 0 0 6px}
.kli{display:flex;align-items:center;gap:4px}
.kb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:7px 2px;min-height:38px;color:var(--ink);font-size:16px}
.kdash{flex:none;width:16px;text-align:center;color:var(--muted);font-weight:700}
.kli.done .kdash{color:var(--accent)}
.kli.done .kw{text-decoration:line-through;color:var(--muted)}
.kb .rep{margin-left:auto;color:var(--muted);font-size:12px;flex:none}
.ked{flex:none;border:none;background:none;color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:15px}
.ked:hover{background:var(--today)}
.ksrc{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ksrc .chip{flex:none;white-space:nowrap}
.ksrc .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.kpick{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);max-height:34vh;overflow:auto}
.kpick .chip[aria-pressed="true"]{background:var(--today);border-color:var(--accent);font-weight:700}
.kpick .chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}
.kpick-tools{display:flex;gap:14px}
.linkb{border:none;background:none;color:var(--accent);font-weight:700;padding:6px 0;font-size:14px}
.dsel{display:flex;gap:6px;flex-wrap:wrap}
.dsel .chip{min-width:44px;justify-content:center}
/* day view */
.dlink{background:none;border:none;padding:0;text-align:left;color:inherit;font:inherit;align-self:start;display:flex;flex-direction:column;gap:1px}
.dlink:hover .dname{color:var(--accent)}
.dwi{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dwx{display:flex;gap:12px;align-items:center;width:100%;background:var(--today);border:none;border-radius:12px;padding:10px 14px;margin-bottom:10px;text-align:left;color:var(--ink)}
.dwx-i{font-size:34px;line-height:1}
.dwx-t{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:14px;color:var(--muted)}
.dwx-t b{color:var(--ink);font-size:16px}
.dwx-a{display:inline-block;align-self:flex-start;background:var(--alert-bg);color:var(--alert-ink);font-weight:700;border-radius:8px;padding:3px 8px;font-size:13px}
.dayadd{margin-top:12px}
/* weather sheet */
.sheet.xl{width:min(940px,100%);max-height:94vh}
.wx-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wx-head h3{flex:1}
.wx-sun{font-size:13px;color:var(--muted)}
.wx-al{display:flex;flex-direction:column;gap:6px}
.wx-al div{background:var(--alert-bg);color:var(--alert-ink);border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px}
.wx-al div.hi{background:var(--danger);color:#fff}

<script>
(function(){
"use strict";
function $(s){return document.querySelector(s);}
var COLORS=["n1","n2","n3","n4","n5","n6"];
var DAYS=["ma","ti","ke","to","pe","la","su"];
var DAYS_LONG=["maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai","sunnuntai"];
var MONTHS=["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"];
var DEFAULTS={family:[],links:[],stops:"",lines:"",lat:60.4518,lon:22.2666,place:"Turku"};
var S={notes:[],events:[],lists:[],items:[],inflight:0,gcal:[],gcalError:"",settings:clone(DEFAULTS),weekOffset:0,monthOffset:0,dayOffset:0,n7Offset:0,view:"next7",loaded:false,online:true,busProxy:false,deps:[],busErr:"",busTime:0,weather:null};

/* ---------- local storage (per device) ---------- */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function hm(d){return pad(d.getHours())+"."+pad(d.getMinutes());}
function dow(d){return (d.getDay()+6)%7;}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
function monday(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-dow(d)+off*7);return d;}
function minus(n){return String(n).replace("-","−");}

/* ---------- theme: auto dark 21–7 ---------- */
function applyTheme(){
  setTimeout(function(){if(window.fxRestart)fxRestart();},0);
  var pref=lsGet("theme","auto"),h=new Date().getHours();
  var dark=pref==="dark"||(pref==="auto"&&(h>=21||h<7));
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
}

/* ---------- clock ---------- */
var lastDay="",lastMin=-1;
function tick(){
  var d=new Date();
  $("#clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes())+"<small>"+pad(d.getSeconds())+"</small>";
  var k=ymd(d);
  if(k!==lastDay){lastDay=k;
    $("#day").textContent=cap(DAYS_LONG[dow(d)])+" "+d.getDate()+". "+MONTHS[d.getMonth()];
    $("#week").textContent="Viikko "+isoWeek(d)+" · "+d.getFullYear();
    S.weekOffset=0;S.monthOffset=0;S.dayOffset=0;S.n7Offset=0;renderWeek();renderNotes();renderKids();
  }
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();applyTheme();renderWeek();renderWeather();if(d.getMinutes()===0)renderKids();}
  if(d.getSeconds()%5===0)renderDeps();
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function member(n){var f=S.settings.family||[];for(var i=0;i<f.length;i++)if(f[i].name===n)return f[i];return null;}
function colorOf(n){var m=member(n);return m?"var(--"+m.color+")":"var(--n1)";}
function toast(msg,ms){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},ms||2800);}

/* ---------- backend ---------- */
function configured(){return /^https:\/\/script\.google\.com\//.test(BACKEND_URL);}
function key(){return lsGet("familyKey","");}
function handle(res){
  if(!res||res.ok===false){
    if(res&&res.error==="key"){askKey(true);}
    throw new Error(res&&res.error||"virhe");
  }
  S.notes=res.notes||[];S.events=res.events||[];S.lists=res.lists||[];S.items=res.items||[];S.gcal=Array.isArray(res.gcal)?res.gcal:[];S.gcalError=res.gcalError||"";
  var st=res.settings||{};S.settings=clone(DEFAULTS);for(var k in st)S.settings[k]=st[k];
  S.loaded=true;S.online=true;
  applyBg();
  renderAll();
  return res;
}
/* Reads the reply as text so a Google error or sign-in page can be explained instead of failing silently. */
function parseResp(r){
  return r.text().then(function(t){
    try{return JSON.parse(t);}catch(e){}
    var low=t.toLowerCase();
    if(low.indexOf("accounts.google")>=0||low.indexOf("servicelogin")>=0||low.indexOf("sign in")>=0||low.indexOf("kirjaudu")>=0)throw new Error("login");
    if(low.indexOf("dopost")>=0||low.indexOf("doget")>=0)throw new Error("nocode");
    var plain=t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    var err=new Error("html");err.detail=plain.slice(0,160);throw err;
  });
}
function explain(e){
  var m=e&&e.message;
  if(m==="key")return "Väärä perheen avain. Tarkista, että se on sama kuin Code.gs-tiedostossa.";
  if(m==="login")return "Taustapalvelu vaatii kirjautumisen. Vaihda Apps Scriptin käyttöönotossa ”Kuka voi käyttää” → Kuka tahansa ja tee uusi versio.";
  if(m==="nocode")return "Taustapalvelusta puuttuu koodi. Tallenna Code.gs editorissa ja tee uusi käyttöönotto (Hallinnoi käyttöönottoja → Muokkaa → Uusi versio).";
  if(m==="html")return "Taustapalvelu antoi virheen: "+(e.detail||"tuntematon");
  if(m==="op"||m==="json")return "Taustapalvelun koodi on vanha. Päivitä Code.gs ja tee uusi versio.";
  return "Yhteys taustapalveluun ei onnistunut. Tarkista index.html:n osoite (päättyy /exec) ja nettiyhteys.";
}
function report(e){S.lastErr=explain(e);toast(S.lastErr,9000);renderFoot();}
/* every request is a POST so the family key never shows up in addresses or browser history */
function rawPost(body){body.key=key();return fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(parseResp);}
function load(){
  if(!configured()||!key()||S.inflight)return Promise.resolve();
  return rawPost({op:"get"}).then(handle)
    .then(function(r){if(S.lastErr){S.lastErr="";renderFoot();}return r;})

function send(body){
  if(!configured()){toast("Taustapalvelun osoite puuttuu index.html-tiedostosta.",9000);return Promise.reject(new Error("cfg"));}
  if(!key()){askKey();return Promise.reject(new Error("key"));}
  body.key=key();
  return fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(parseResp).then(handle)
    .then(function(r){S.lastErr="";renderFoot();return r;})
    .catch(function(e){report(e);throw e;});

/* List actions update the screen at once and are sent one after another in the background.
   Server replies are applied only when nothing is still waiting, so quick taps don't flicker back. */
function sendQ(body){
  if(!configured()||!key()){toast("Taustapalvelu puuttuu tai avain on syöttämättä.",6000);return;}
  S.inflight++;body.key=key();
  S.q=(S.q||Promise.resolve()).then(function(){
    return fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
      .then(parseResp).then(function(res){S.inflight--;if(!res||res.ok===false)throw new Error(res&&res.error||"virhe");if(!S.inflight)handle(res);})
      .catch(function(e){S.inflight=Math.max(0,S.inflight-1);report(e);if(!S.inflight)load();});
  });
}

/* Clothing suggestion for a school or daycare day, from the morning and daytime forecast. */
function kidWear(k){
  var j=S.weather;if(!j||!j.hourly||!j.hourly.time)return null;
  var h=j.hourly,tm=[],pr=0,pp=0,snowH=false,wind=0;
  for(var i=0;i<h.time.length;i++){
    if(h.time[i].slice(0,10)!==k)continue;var hr=+h.time[i].slice(11,13);
    if(hr>=7&&hr<=9){tm.push(h.temperature_2m[i]);wind=Math.max(wind,h.wind_speed_10m[i]||0);}
    if(hr>=7&&hr<=16){pr+=h.precipitation[i]||0;pp=Math.max(pp,h.precipitation_probability[i]||0);var c=h.weather_code[i];if((c>=71&&c<=77)||c===85||c===86)snowH=true;}
  }
  if(!tm.length)return null;
  var t=Math.min.apply(null,tm),di=dailyIdx(k),sn=di>=0?(S.weather.daily.snowfall_sum[di]||0):0,snow=snowH||sn>=0.5,wet=!snow&&pr>=0.5;
  var feel=t-(wind>=6?3:wind>=3?1:0),wear,extra=[],ic;
  if(feel<=-12){wear="Toppapuku ja villakerrasto, paksu pipo, lapaset ja kaulahuivi";ic="🥶";}
  else if(feel<=-1){wear="Toppahousut ja -takki, pipo ja lapaset";ic="🧤";}
  else if(feel<=5){wear="Välikausi- tai toppahousut, lämmin takki, pipo ja hanskat";ic="🧣";}
  else if(feel<=11){wear="Välikausitakki ja -housut, ohut pipo";ic="🧥";}
  else if(feel<=17){wear="Kevyt takki tai huppari";ic="🧥";}
  else {wear="T-paita ja shortsit tai hame, lippis";ic="👕";}
  if(snow){extra.push("talvikengät ja varalapaset");ic="❄️";}
  else if(wet){extra.push(t>1?"kurahousut ja kumisaappaat":"vedenpitävät kengät");ic="🌧️";}
  else if(pp>=60)extra.push("sadetakki mukaan");
  if(t>=20)extra.push("aurinkorasva ja juomapullo");
  if(weatherAlerts().some(function(a){return a.k===k&&/liukka/.test(a.t);}))extra.push("liukuesteet kenkiin");
  var cond=snow?", lunta":wet?", sadetta":pp>=60?", sade mahdollinen":"";
  return {ic:ic,t:t,cond:cond,head:"Aamulla "+rnd(t)+"°"+cond,text:wear+(extra.length?" · "+extra.join(", "):"")};
}

function goDay(k){var p=k.split("-"),d=new Date(+p[0],p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);S.dayOffset=Math.round((d-t)/864e5);S.view="day";lsSet("calView","day");renderWeek();}
/* Household chores (from the lists app) that are due today or late */
function pjson(s){try{var o=JSON.parse(s||"{}");return o&&typeof o==="object"?o:{};}catch(e){return {};}}
function dueChores(){
  var out=[],fam=(S.settings.family||[]).map(function(f){return f.name;});
  var ids={};(S.lists||[]).forEach(function(l){if(l.type==="chores")ids[l.id]=1;});
  (S.items||[]).forEach(function(it){if(!ids[it.list])return;var d=pjson(it.data),every=Number(d.every)||7,last=Number(d.last)||0;
    var t0=new Date();t0.setHours(0,0,0,0);var diff;
    if(!last)diff=0;else{var l0=new Date(last);l0.setHours(0,0,0,0);if(l0.getTime()===t0.getTime())return;diff=Math.round((l0.getTime()+every*864e5-t0.getTime())/864e5);}
    if(diff>0)return;
    var turn="";if(d.assign&&d.assign!=="rot")turn=d.assign;else if(fam.length){if(!d.doneBy){var h=0,id=String(it.id);for(var k=0;k<id.length;k++)h=(h*31+id.charCodeAt(k))>>>0;turn=fam[h%fam.length];}else turn=fam[(fam.indexOf(d.doneBy)+1)%fam.length];}
    out.push({text:it.text,list:it.list,late:diff<0,turn:turn,diff:diff});});

    var url=URL.createObjectURL(file),im=new Image();

      var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);

/* ---------- weather: helpers, alerts, forecast sheet ---------- */
var DAYS_ESS=["maanantaina","tiistaina","keskiviikkona","torstaina","perjantaina","lauantaina","sunnuntaina"];
function pd(k){var p=String(k).split("-");return new Date(+p[0],p[1]-1,+p[2]);}
function relDays(k){var t=new Date();t.setHours(0,0,0,0);return Math.round((pd(k)-t)/864e5);}
function dayWord(k){var r=relDays(k),d=pd(k);if(r===0)return "tänään";if(r===1)return "huomenna";if(r<7)return DAYS_ESS[dow(d)];return DAYS_ESS[dow(d)]+" "+d.getDate()+"."+(d.getMonth()+1)+".";}
function f1(x){return String(Math.round(x*10)/10).replace(".",",");}
function rnd(x){return minus(Math.round(x));}
/* Notices about weather worth acting on: snow, heavy rain, sudden frost, slippery roads, strong wind, heat. */
function weatherAlerts(){
  var j=S.weather;if(!j||!j.daily||!j.daily.time)return [];
  var d=j.daily,h=j.hourly||{},out=[],now=new Date(),n=Math.min(d.time.length,7);
  function at(a,i){return a&&a[i]!=null?a[i]:0;}
  /* when today's rain or snow starts, from the hourly forecast */
  var startTxt="";
  if(h.time){var cur=at(h.precipitation,0),started=false;
    for(var x=0;x<h.time.length;x++){var t=new Date(h.time[x]);if(t<now-3600000)continue;if(t.getDate()!==now.getDate())break;
      var wet=at(h.precipitation,x)>=0.2&&at(h.precipitation_probability,x)>=50;
      if(t<=now){started=wet;continue;}
      if(wet&&!started){startTxt=" (alkaa noin klo "+t.getHours()+")";break;}}}
  for(var i=0;i<n;i++){
    var k=d.time[i],w=cap(dayWord(k)),mn=at(d.temperature_2m_min,i),mx=at(d.temperature_2m_max,i),pr=at(d.precipitation_sum,i),sn=at(d.snowfall_sum,i),
        g=at(d.wind_gusts_10m_max,i),code=at(d.weather_code,i),prevMn=i>0?at(d.temperature_2m_min,i-1):null,st=i===0?startTxt:"";
    if(code===56||code===57||code===66||code===67)out.push({k:k,i:i,sev:3,ic:"⚠️",t:w+" jäätävää sadetta, erittäin liukasta"});
    var frost=i>0&&mn<0&&prevMn>=1;
    if(sn>=1)out.push({k:k,i:i,sev:sn>=5?3:2,ic:"❄️",t:w+" lunta "+f1(sn)+" cm"+st+(mn<=0&&mx>0&&!frost?", liukasta":"")});
    else if(pr>=4)out.push({k:k,i:i,sev:pr>=12?3:pr>=8?2:1,ic:"🌧️",t:w+" sadetta "+f1(pr)+" mm"+st});
    if(frost)out.push({k:k,i:i,sev:2,ic:"🥶",t:w+" yöpakkasta "+rnd(mn)+"°, varo liukkautta"});
    else if(i>0&&prevMn-mn>=7)out.push({k:k,i:i,sev:2,ic:"🥶",t:w+" kylmenee selvästi, yöllä "+rnd(mn)+"°"});
    else if(mn<=-15)out.push({k:k,i:i,sev:2,ic:"🥶",t:w+" kovaa pakkasta "+rnd(mn)+"°"});
    if(g>=15)out.push({k:k,i:i,sev:g>=21?3:2,ic:"💨",t:w+" kovaa tuulta, puuskat "+Math.round(g)+" m/s"});
    if(code>=95)out.push({k:k,i:i,sev:2,ic:"⛈️",t:w+" ukkosta"});
    if(mx>=27)out.push({k:k,i:i,sev:mx>=30?2:1,ic:"🥵",t:w+" hellettä "+Math.round(mx)+"°"});
  }
  out.sort(function(a,b){return (b.sev*10-b.i*4)-(a.sev*10-a.i*4);});
  return out;
}

/* Buses of this line plus any bus whose upcoming stops include ours. Some regional lines carry a

  if(S.vmProxy)return viaProxy();

      return Object.keys(v).map(function(k){var x=v[k];if(x&&!x._id)x._id=k;return x;}).filter(function(x){return x&&(lineMatch(x,L)||(x.onwardcalls||[]).some(function(c){return sameStop(callRef(c),stop);}));});})

function asList(j){return Array.isArray(j)?j:Object.keys(j||{}).map(function(k){return j[k];});}

    .catch(function(e){var st=$("#bmSt");if(st&&S.bm===bm)st.textContent=e&&e.message==="op"?"Bussikartta tarvitsee päivitetyn Code.gs:n.":"Bussien sijainteja ei saatu juuri nyt. Yritetään uudelleen.";})

/* ---------- sheets ---------- */
function openSheet(html,bind){var s=$("#sheet");s.innerHTML=html;$("#overlay").hidden=false;bind(s);var f=s.querySelector("textarea,input");if(f&&!s.classList.contains("wide"))setTimeout(function(){f.focus();},50);}
function closeSheet(){S.listOpen=false;if(S.bm){clearTimeout(S.bm.timer);if(S.bm.map)S.bm.map.remove();S.bm=null;}$("#overlay").hidden=true;var sh=$("#sheet");sh.innerHTML="";sh.classList.remove("wide");sh.classList.remove("xl");}
$("#overlay").addEventListener("click",function(e){if(e.target.id==="overlay"&&!S.mustKey)closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#overlay").hidden&&!S.mustKey)closeSheet();});

function whoChips(sel){
  var fam=S.settings.family||[];
  if(!fam.length)return '<p class="hint">Lisää perheenjäsenet asetuksista, niin laput saavat omat värit.</p>';
  return '<div class="chips" id="who"><button type="button" class="chip none" data-who="" aria-pressed="'+(!sel)+'">Kaikki</button>'+
    fam.map(function(f){return '<button type="button" class="chip" data-who="'+esc(f.name)+'" style="background:var(--'+f.color+')" aria-pressed="'+(sel===f.name)+'">'+esc(f.name)+'</button>';}).join("")+'</div>';
}
function bindChips(s){var cur=s.querySelector('#who [aria-pressed="true"]'),v=cur?cur.dataset.who:"";
  var cs=s.querySelectorAll("#who .chip");for(var i=0;i<cs.length;i++)(function(c){c.onclick=function(){for(var j=0;j<cs.length;j++)cs[j].setAttribute("aria-pressed","false");c.setAttribute("aria-pressed","true");v=c.dataset.who;};})(cs[i]);
  return function(){return v;};}
function confirmBtn(btn,fn){btn.onclick=function(){if(btn.dataset.sure!=="1"){btn.dataset.sure="1";btn.textContent="Vahvista poisto";return;}fn();};}
function busy(btn,p){btn.disabled=true;var t=btn.textContent;btn.textContent="Tallennetaan…";p.then(function(){closeSheet();},function(){btn.disabled=false;btn.textContent=t;});}

function noteSheet(n){
  var edit=!!n,imgId=n&&n.img?n.img:"",newImg=null,removed=false;
  openSheet('<h3>'+(edit?"Muokkaa lappua":"Uusi lappu")+'</h3>'+
   '<div class="field"><span class="flabel">Kuva (valinnainen)</span>'+
     '<img id="nPrev" class="photo-prev" alt=""'+(imgId?' data-ph="'+esc(imgId)+'"':"")+' hidden>'+
     '<div class="chips"><label class="btn" for="nFile" id="nPick">'+(imgId?"Vaihda kuva":"Lisää kuva")+'</label><input id="nFile" class="vh" type="file" accept="image/*">'+
     '<button class="btn" type="button" id="nRemove"'+(imgId?"":" hidden")+'>Poista kuva</button></div><p class="hint" id="nImgMsg"></p></div>'+
   '<div class="field"><label for="nText">Viesti'+(imgId?" (valinnainen)":"")+'</label><textarea id="nText" maxlength="240">'+esc(n?n.text:"")+'</textarea></div>'+
   '<div class="field"><span class="flabel">Keneltä tai kenelle</span>'+whoChips(n?n.who:"")+'</div>'+
   '<div class="sheet-actions">'+(edit?'<button class="btn danger" type="button" id="del">Poista lappu</button>':"")+'<button class="btn" type="button" id="cancel">Peruuta</button><button class="btn primary" type="button" id="save">Tallenna</button></div>',
  function(s){var who=bindChips(s),prev=s.querySelector("#nPrev"),msg=s.querySelector("#nImgMsg");
    if(imgId)hydratePhotos(s);
    s.querySelector("#nFile").onchange=function(){var f=this.files&&this.files[0];if(!f)return;msg.textContent="Käsitellään kuvaa…";
      shrink(f).then(function(data){newImg=data;removed=false;prev.src=data;prev.hidden=false;s.querySelector("#nRemove").hidden=false;s.querySelector("#nPick").textContent="Vaihda kuva";msg.textContent="";},
        function(){msg.textContent="Kuvaa ei voitu avata. Kokeile toista kuvaa (JPG tai PNG).";});};
    s.querySelector("#nRemove").onclick=function(){newImg=null;removed=true;prev.hidden=true;prev.removeAttribute("src");this.hidden=true;s.querySelector("#nPick").textContent="Lisää kuva";};
    s.querySelector("#cancel").onclick=closeSheet;
    s.querySelector("#save").onclick=function(){var text=s.querySelector("#nText").value.trim(),hasImg=!!newImg||(imgId&&!removed);
      if(!text&&!hasImg)return s.querySelector("#nText").focus();
      var body={op:"upsert",table:"notes",row:{id:edit?n.id:newId(),text:text,who:who(),ts:edit?n.ts:Date.now(),img:removed?"":imgId}};
      if(newImg)body.image=newImg;
      busy(this,send(body).then(function(){toast("Lappu tallennettu");}));};
    if(edit)confirmBtn(s.querySelector("#del"),function(){send({op:"delete",table:"notes",id:n.id}).then(function(){closeSheet();toast("Lappu poistettu");});});
  });
}

function eventSheet(e,preset){
  var edit=!!e,today=preset||ymd(new Date());
  openSheet('<h3>'+(edit?"Muokkaa tapahtumaa":"Uusi tapahtuma")+'</h3>'+
   '<div class="field"><label for="eText">Mitä</label><input id="eText" maxlength="80" value="'+esc(e?e.text:"")+'" placeholder="esim. Uintitreenit"></div>'+
   '<div class="field"><label for="eDate">Päivä</label><input id="eDate" type="date" value="'+esc(e?e.date:today)+'"></div>'+
   '<div class="row2"><div class="field"><label for="eTime">Alkaa (valinnainen)</label><input id="eTime" type="time" value="'+esc(e?e.time:"")+'"></div>'+
   '<div class="field"><label for="eEnd">Päättyy (valinnainen)</label><input id="eEnd" type="time" value="'+esc(e&&e.end?e.end:"")+'"></div></div>'+
   '<div class="field"><label for="eNote">Paikka tai lisätieto</label><input id="eNote" maxlength="80" value="'+esc(e&&e.note?e.note:"")+'" placeholder="esim. Impivaaran uimahalli, ota uimalasit"></div>'+
   '<div class="field"><span class="flabel">Kenen</span>'+whoChips(e?e.who:"")+'</div>'+
   '<div class="sheet-actions">'+(edit?'<button class="btn danger" type="button" id="del">Poista</button>':"")+'<button class="btn" type="button" id="cancel">Peruuta</button><button class="btn primary" type="button" id="save">Tallenna</button></div>',
  function(s){var who=bindChips(s);
    s.querySelector("#cancel").onclick=closeSheet;
    s.querySelector("#save").onclick=function(){var text=s.querySelector("#eText").value.trim(),date=s.querySelector("#eDate").value,time=s.querySelector("#eTime").value,end=s.querySelector("#eEnd").value,note=s.querySelector("#eNote").value.trim();
      if(!time)end="";if(end&&end<=time)end="";
      if(!text)return s.querySelector("#eText").focus();if(!date)return s.querySelector("#eDate").focus();
      busy(this,send({op:"upsert",table:"events",row:{id:edit?e.id:newId(),text:text,date:date,time:time,end:end,note:note,who:who(),ts:edit?e.ts:Date.now()}}).then(function(){toast("Tapahtuma tallennettu");jumpTo(date);}));};
    if(edit)confirmBtn(s.querySelector("#del"),function(){send({op:"delete",table:"events",id:e.id}).then(function(){closeSheet();toast("Tapahtuma poistettu");});});
  });
}
function gcalSheet(e){
  var p=e.date.split("-"),d=new Date(+p[0],p[1]-1,+p[2]);
  openSheet('<h3>'+esc(e.text)+'</h3>'+
    '<p class="hint" style="font-size:16px;color:var(--ink)">'+cap(DAYS_LONG[dow(d)])+' '+d.getDate()+'. '+MONTHS[d.getMonth()]+(e.time?' · klo '+esc(e.time.replace(":","."))+(e.end?'–'+esc(e.end.replace(":",".")):""):' · koko päivä')+'</p>'+
    (e.loc?'<p class="hint">'+esc(e.loc)+'</p>':"")+
    '<p class="hint">Google-kalenteri: '+esc(e.cal||"")+'. Muokkaa tätä menoa Google-kalenterissa, niin muutos näkyy taululla parin minuutin kuluttua.</p>'+
    '<div class="sheet-actions"><button class="btn primary" type="button" id="ok">Selvä</button></div>',
  function(s){s.querySelector("#ok").onclick=closeSheet;});
}
function jumpTo(date){var p=date.split("-"),d=new Date(+p[0],p[1]-1,+p[2]),now=new Date(),t0=new Date();t0.setHours(0,0,0,0);
  S.dayOffset=Math.round((d-t0)/864e5);S.n7Offset=Math.floor(S.dayOffset/7);
  S.monthOffset=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth();
  d.setDate(d.getDate()-dow(d));S.weekOffset=Math.round((d-monday(0))/(7*864e5));renderWeek();}

function askKey(wrong){
  if(!configured()||(S.mustKey&&!wrong))return;
  S.mustKey=true;
  openSheet('<h3>Perheen avain</h3><p class="hint">Syötä sama avain, jonka kirjoitit taustapalvelun Code.gs-tiedostoon. Laite muistaa sen.</p>'+
    (wrong?'<p class="err">Avain ei kelpaa. Tarkista kirjoitusasu.</p>':"")+
    '<div class="field"><label for="kIn">Avain</label><input id="kIn" type="password" autocomplete="current-password"></div>'+
    '<div class="sheet-actions"><button class="btn primary" type="button" id="kSave">Jatka</button></div>',
  function(s){var go=function(){var v=s.querySelector("#kIn").value.trim();if(!v)return;lsSet("familyKey",v);S.mustKey=false;closeSheet();load().then(function(){loadBus();});};
    s.querySelector("#kSave").onclick=go;s.querySelector("#kIn").addEventListener("keydown",function(e){if(e.key==="Enter")go();});});
}

/* ---------- lists (shopping, packing, …) ---------- */
var LIST_PRESETS=["Kauppalista","Pakkauslista"];
function listItems(id){return S.items.filter(function(i){return i.list===id;});}
function openCount(){var l=S.lists.filter(function(x){return x.type==="shop"||(!x.type&&/kauppa/i.test(x.name));})[0];if(!l)return 0;return listItems(l.id).filter(function(i){return i.done!=="1";}).length;}
function renderListBtn(){var c=$("#listCnt");if(c){var lists=S.lists.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);});S.lists=lists;var n=openCount();c.textContent=n?String(n):"";}}
function listsSheet(activeId){
  S.listOpen=true;
  var sorted=S.lists.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  var cur=activeId||lsGet("lastList","");if(!sorted.some(function(l){return l.id===cur;}))cur=sorted[0]?sorted[0].id:"";
  S.curList=cur;
  openSheet('<h3>Listat</h3><div class="ltabs" id="ltabs"></div><div id="lbody" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0"></div>'+
    '<div class="sheet-actions"><button class="btn" type="button" id="lclose">Sulje</button></div>',
  function(s){
    s.classList.add("wide");
    s.querySelector("#lclose").onclick=function(){S.listOpen=false;closeSheet();};
    drawLists();
  });
}
function drawLists(){
  var s=$("#sheet");if(!S.listOpen||!s)return;
  var tabs=s.querySelector("#ltabs"),body=s.querySelector("#lbody");if(!tabs||!body)return;
  var sorted=S.lists.filter(function(l){return l.type!=="kids"&&l.type!=="kmode";}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  if(!sorted.some(function(l){return l.id===S.curList;}))S.curList=sorted[0]?sorted[0].id:"";
  tabs.innerHTML=sorted.map(function(l){var n=listItems(l.id).filter(function(i){return i.done!=="1";}).length;
    return '<button type="button" class="ltab" data-l="'+esc(l.id)+'" aria-pressed="'+(l.id===S.curList)+'">'+esc(l.name)+(n?' · '+n:"")+'</button>';}).join("")+
    '<button type="button" class="ltab" id="lnew">+ Uusi lista</button>';
  var tb=tabs.querySelectorAll("[data-l]");for(var i=0;i<tb.length;i++)tb[i].onclick=function(){S.curList=this.dataset.l;lsSet("lastList",S.curList);drawLists();};
  tabs.querySelector("#lnew").onclick=newListForm;
  if(!S.curList){
    body.innerHTML='<p class="hint">Ei vielä listoja. Aloita valmiilla pohjalla:</p><div class="chips">'+LIST_PRESETS.map(function(n){return '<button type="button" class="btn" data-p="'+n+'">'+n+'</button>';}).join("")+'</div>';
    var pb=body.querySelectorAll("[data-p]");for(i=0;i<pb.length;i++)pb[i].onclick=function(){createList(this.dataset.p);};
    return;
  }
  // keep the add field (and its focus) if it is already there
  if(!body.querySelector("#lin")||body.dataset.l!==S.curList){
    body.dataset.l=S.curList;
    body.innerHTML='<form class="ladd" id="lform" autocomplete="off"><input id="lin" placeholder="Lisää… (useampi rivi = useampi asia)" enterkeyhint="done"><button class="btn primary" type="submit">Lisää</button></form>'+
      '<ul class="litems" id="litems"></ul>'+
      '<div class="chips"><button type="button" class="btn" id="lclear">Poista ruksatut</button><button type="button" class="btn" id="luncheck">Poista ruksit</button><button type="button" class="btn" id="ledit">Muokkaa listaa</button></div>'+
      '<div id="leditbox" hidden class="li"><input id="lname" maxlength="30"><button type="button" class="btn" id="lrename">Tallenna nimi</button><button type="button" class="btn danger" id="ldel" style="margin-right:0">Poista lista</button></div>';
    body.querySelector("#lform").onsubmit=function(ev){ev.preventDefault();var inp=body.querySelector("#lin");addItems(inp.value);inp.value="";inp.focus();};
    body.querySelector("#lin").addEventListener("paste",function(){var inp=this;setTimeout(function(){if(inp.value.indexOf("\n")>=0){addItems(inp.value);inp.value="";}},0);});
    body.querySelector("#lclear").onclick=function(){var id=S.curList;S.items=S.items.filter(function(i){return !(i.list===id&&i.done==="1");});drawLists();renderListBtn();sendQ({op:"clearDone",list:id});};
    body.querySelector("#luncheck").onclick=function(){var id=S.curList;S.items.forEach(function(i){if(i.list===id)i.done="";});drawLists();renderListBtn();sendQ({op:"uncheckAll",list:id});};
    body.querySelector("#ledit").onclick=function(){var b=body.querySelector("#leditbox");b.hidden=!b.hidden;var l=S.lists.filter(function(x){return x.id===S.curList;})[0];body.querySelector("#lname").value=l?l.name:"";};
    body.querySelector("#lrename").onclick=function(){var v=body.querySelector("#lname").value.trim();if(!v)return;var l=S.lists.filter(function(x){return x.id===S.curList;})[0];if(!l)return;l.name=v;body.querySelector("#leditbox").hidden=true;drawLists();sendQ({op:"upsert",table:"lists",row:{id:l.id,name:v,ts:l.ts}});};
    confirmBtn(body.querySelector("#ldel"),function(){var id=S.curList;S.lists=S.lists.filter(function(x){return x.id!==id;});S.items=S.items.filter(function(i){return i.list!==id;});S.curList="";body.dataset.l="";drawLists();renderListBtn();sendQ({op:"delete",table:"lists",id:id});});
  }
  var ul=body.querySelector("#litems"),its=listItems(S.curList);
  var open=its.filter(function(i){return i.done!=="1";}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  var done=its.filter(function(i){return i.done==="1";}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
  var ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
  function li(i){return '<li class="litem'+(i.done==="1"?" done":"")+'" data-i="'+esc(i.id)+'"><button type="button" class="ck" aria-label="'+(i.done==="1"?"Poista ruksi":"Ruksaa")+'">'+ck+'</button><button type="button" class="lt">'+esc(i.text)+'</button><button type="button" class="lx" aria-label="Poista">&times;</button></li>';}
  ul.innerHTML=(open.length?open.map(li).join(""):'<li class="hint" style="padding:12px 0">'+(done.length?"Kaikki ruksattu.":"Lista on tyhjä. Kirjoita yllä olevaan kenttään.")+'</li>')+
    (done.length?'<li class="lsep">Ruksatut ('+done.length+')</li>'+done.map(li).join(""):"");
  var rows=ul.querySelectorAll("[data-i]");
  for(i=0;i<rows.length;i++)(function(row){
    var it=S.items.filter(function(x){return x.id===row.dataset.i;})[0];if(!it)return;
    var toggle=function(){it.done=it.done==="1"?"":"1";drawLists();renderListBtn();sendQ({op:"upsert",table:"items",row:it});};
    row.querySelector(".ck").onclick=toggle;row.querySelector(".lt").onclick=toggle;
    row.querySelector(".lx").onclick=function(){S.items=S.items.filter(function(x){return x.id!==it.id;});drawLists();renderListBtn();sendQ({op:"delete",table:"items",id:it.id});};
  })(rows[i]);
}
function addItems(text){
  var lines=String(text).split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean).slice(0,40);
  var t=Date.now();
  lines.forEach(function(line,n){var it={id:newId(),list:S.curList,text:line.slice(0,120),done:"",ts:t+n};S.items.push(it);sendQ({op:"upsert",table:"items",row:it});});
  drawLists();renderListBtn();
}
function createList(name){var l={id:newId(),name:name,ts:Date.now()};S.lists.push(l);S.curList=l.id;lsSet("lastList",l.id);var b=$("#lbody");if(b)b.dataset.l="";drawLists();sendQ({op:"upsert",table:"lists",row:l});}
function newListForm(){
  var body=$("#lbody");body.dataset.l="";
  body.innerHTML='<div class="field"><label for="lnewname">Uuden listan nimi</label><input id="lnewname" maxlength="30" placeholder="esim. Mökkireissu"></div><div class="chips">'+
    LIST_PRESETS.map(function(n){return '<button type="button" class="btn" data-p="'+n+'">'+n+'</button>';}).join("")+'<button type="button" class="btn primary" id="lcreate">Luo lista</button></div>';
  var inp=body.querySelector("#lnewname");inp.focus();
  body.querySelector("#lcreate").onclick=function(){var v=inp.value.trim();if(!v)return inp.focus();createList(v);};
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();body.querySelector("#lcreate").click();}});
  var pb=body.querySelectorAll("[data-p]");for(var i=0;i<pb.length;i++)pb[i].onclick=function(){createList(this.dataset.p);};
}

function settingsSheet(){
  var st=S.settings,fam=clone(st.family||[]),links=clone(st.links||[]),names=clone(st.stopNames||{});
  var pick=COLORS[fam.length%COLORS.length],theme=lsGet("theme","auto"),fxPref=lsGet("fx","on");
  openSheet('<h3>Asetukset</h3>'+
   '<div class="field"><span class="flabel">Perheenjäsenet</span><div class="list" id="famList"></div>'+
     '<div class="li"><input id="famName" maxlength="20" placeholder="Nimi"><button class="btn" type="button" id="famAdd">Lisää</button></div>'+
     '<div class="swatches" id="sw">'+COLORS.map(function(c,i){return '<button type="button" class="sw" data-c="'+c+'" style="background:var(--'+c+')" aria-label="Väri '+(i+1)+'"></button>';}).join("")+'</div></div>'+
   '<div class="field"><label for="stops">Pysäkkien numerot (enintään 3, pilkulla erotettuna)</label><input id="stops" value="'+esc(st.stops||"")+'" placeholder="esim. 1170, 1171" autocapitalize="characters"></div>'+
   '<div id="stopNames" class="list"></div>'+
   '<div class="field"><label for="lines">Näytä vain linjat (valinnainen)</label><input id="lines" value="'+esc(st.lines||"")+'" placeholder="esim. 18, 32"></div>'+
   '<div class="row2"><div class="field"><label for="lat">Sään leveysaste</label><input id="lat" inputmode="decimal" value="'+esc(st.lat)+'"></div><div class="field"><label for="lon">Pituusaste</label><input id="lon" inputmode="decimal" value="'+esc(st.lon)+'"></div></div>'+
   '<p class="hint">Oletuksena Turun keskusta. Oman kotisi koordinaatit saat karttasovelluksesta painamalla kohtaa pitkään.</p>'+
   '<div class="field"><span class="flabel">Pikalinkit</span><div class="list" id="linkList"></div>'+
     '<div class="row2"><input id="lLabel" maxlength="24" placeholder="Nimi"><input id="lUrl" placeholder="https://…" inputmode="url"></div>'+
     '<div><button class="btn" type="button" id="linkAdd">Lisää linkki</button></div></div>'+
   '<div class="field"><label for="bg">Taustakuva</label><input id="bg" value="'+esc(st.bg==null?"tausta.jpg":st.bg)+'" placeholder="tausta.jpg"></div>'+
   '<p class="hint">Lataa kuva GitHubiin samaan paikkaan kuin index.html nimellä <b>tausta.jpg</b>, niin se tulee taustalle. Tyhjä kenttä = ei kuvaa.</p>'+
   '<div class="field"><span class="flabel">Sääanimaatio tällä laitteella</span><div class="chips" id="fxc">'+
     [["on","Päällä"],["off","Pois"]].map(function(t){return '<button type="button" class="chip none" data-f="'+t[0]+'" aria-pressed="'+(fxPref===t[0])+'">'+t[1]+'</button>';}).join("")+'</div></div>'+
   '<div class="field"><span class="flabel">Osioiden järjestys tällä laitteella</span><div class="list" id="layCols"></div>'+
     '<div class="chips" id="layTop"><span class="hint" style="align-self:center">Keskellä ylempänä:</span></div>'+
     '<div class="chips" id="layShow"></div><p class="hint">Muutos näkyy heti ja koskee vain tätä laitetta.</p></div>'+
   '<div class="field"><span class="flabel">Lapsi-tila</span><div class="chips"><button class="btn" type="button" id="kmEdit">🧸 Muokkaa lapsi-tilan sisältöä</button></div><p class="hint">Rutiinit ja laskurit. Päivän ohjelmaan tulevat tapahtumat, joissa kenen-kohtana on lapsi, ja Lapsille mukaan -asiat.</p></div>'+
   '<div class="field"><span class="flabel">Teema tällä laitteella</span><div class="chips" id="theme">'+
     [["auto","Automaattinen (tumma klo 21–7)"],["light","Vaalea"],["dark","Tumma"]].map(function(t){return '<button type="button" class="chip none" data-t="'+t[0]+'" aria-pressed="'+(theme===t[0])+'">'+t[1]+'</button>';}).join("")+'</div></div>'+
   '<div class="sheet-actions"><button class="btn danger" type="button" id="forget">Unohda avain</button><button class="btn" type="button" id="cancel">Peruuta</button><button class="btn primary" type="button" id="save">Tallenna</button></div>',
  function(s){
    function drawNames(){var ids=String(s.querySelector("#stops").value).split(/[,\s]+/).filter(Boolean).slice(0,3);
      s.querySelector("#stopNames").innerHTML=ids.map(function(id){return '<div class="li"><span class="hint" style="min-width:90px">Pysäkki '+esc(id)+'</span><input data-sn="'+esc(id)+'" maxlength="24" placeholder="Nimi, esim. Kotiin päin" value="'+esc(names[id]||"")+'"></div>';}).join("");
      var ins=s.querySelectorAll("[data-sn]");for(var i=0;i<ins.length;i++)ins[i].oninput=function(){names[this.dataset.sn]=this.value.trim();};}
    function draw(){
      s.querySelector("#famList").innerHTML=fam.map(function(f,i){return '<div class="li"><span class="sw" style="background:var(--'+f.color+');width:24px;height:24px"></span><span class="grow">'+esc(f.name)+'</span><button class="chip none" type="button" data-kid="'+i+'" aria-pressed="'+(!!f.kid)+'">Lapsi</button><button class="btn" type="button" data-rf="'+i+'">Poista</button></div>';}).join("")||'<p class="hint">Ei vielä ketään.</p>';
      s.querySelector("#linkList").innerHTML=links.map(function(l,i){return '<div class="li"><span class="grow"><b>'+esc(l.label)+'</b><br><span class="hint">'+esc(l.url)+'</span></span><button class="btn" type="button" data-rl="'+i+'">Poista</button></div>';}).join("")||'<p class="hint">Ei linkkejä.</p>';
      var sw=s.querySelectorAll("#sw .sw");for(var i=0;i<sw.length;i++)sw[i].setAttribute("aria-pressed",String(sw[i].dataset.c===pick));
      var rf=s.querySelectorAll("[data-rf]");for(i=0;i<rf.length;i++)rf[i].onclick=function(){fam.splice(+this.dataset.rf,1);draw();};
      var kf=s.querySelectorAll("[data-kid]");for(i=0;i<kf.length;i++)kf[i].onclick=function(){var f=fam[+this.dataset.kid];f.kid=!f.kid;draw();};
      var rl=s.querySelectorAll("[data-rl]");for(i=0;i<rl.length;i++)rl[i].onclick=function(){links.splice(+this.dataset.rl,1);draw();};
    }
    var sw=s.querySelectorAll("#sw .sw");for(var i=0;i<sw.length;i++)sw[i].onclick=function(){pick=this.dataset.c;draw();};
    var fc=s.querySelectorAll("#fxc .chip");for(i=0;i<fc.length;i++)fc[i].onclick=function(){for(var j=0;j<fc.length;j++)fc[j].setAttribute("aria-pressed","false");this.setAttribute("aria-pressed","true");fxPref=this.dataset.f;};
    /* section order: instant, per device */
    var LN={cal:"Kalenteri",mid:"Muistilaput ja Lapsille mukaan",bus:"Bussit"},SN={cal:"Kalenteri",notes:"Muistilaput",kids:"Lapsille mukaan",bus:"Bussit"};
    function drawLay(){
      var L=layoutPrefs();
      s.querySelector("#layCols").innerHTML=L.cols.map(function(c,i){return '<div class="li"><span class="grow">'+(i+1)+'. '+LN[c]+'</span><button class="btn sm" type="button" data-lu="'+i+'"'+(i===0?" disabled":"")+' aria-label="Ylemmäs">←</button><button class="btn sm" type="button" data-ld="'+i+'"'+(i===2?" disabled":"")+' aria-label="Alemmas">→</button></div>';}).join("");
      var top=s.querySelector("#layTop");top.querySelectorAll(".chip").forEach(function(x){x.remove();});
      [["notes","Muistilaput"],["kids","Lapsille mukaan"]].forEach(function(o){var b=document.createElement("button");b.type="button";b.className="chip none";b.textContent=o[1];b.setAttribute("aria-pressed",String(L.top===o[0]));
        b.onclick=function(){var P=layoutPrefs();P.top=o[0];lsSet("layout",JSON.stringify(P));applyLayout();drawLay();};top.appendChild(b);});
      s.querySelector("#layShow").innerHTML='<span class="hint" style="align-self:center">Näytä:</span>'+Object.keys(SN).map(function(k){return '<button type="button" class="chip none" data-ls="'+k+'" aria-pressed="'+(!L.hide[k])+'">'+(L.hide[k]?"":"✓ ")+SN[k]+'</button>';}).join("");
      s.querySelectorAll("[data-lu],[data-ld]").forEach(function(b){b.onclick=function(){var P=layoutPrefs(),i=+(b.dataset.lu!=null?b.dataset.lu:b.dataset.ld),j=b.dataset.lu!=null?i-1:i+1;var t=P.cols[i];P.cols[i]=P.cols[j];P.cols[j]=t;lsSet("layout",JSON.stringify(P));applyLayout();drawLay();};});
      s.querySelectorAll("[data-ls]").forEach(function(b){b.onclick=function(){var P=layoutPrefs(),k=b.dataset.ls;P.hide[k]=!P.hide[k];lsSet("layout",JSON.stringify(P));applyLayout();drawLay();};});
    }
    drawLay();
    s.querySelector("#kmEdit").onclick=function(){closeSheet();kidModeSheet();};
    var th=s.querySelectorAll("#theme .chip");for(i=0;i<th.length;i++)th[i].onclick=function(){for(var j=0;j<th.length;j++)th[j].setAttribute("aria-pressed","false");this.setAttribute("aria-pressed","true");theme=this.dataset.t;};
    s.querySelector("#stops").oninput=drawNames;
    s.querySelector("#famAdd").onclick=function(){var el=s.querySelector("#famName"),n=el.value.trim();if(!n||fam.some(function(f){return f.name===n;}))return el.focus();fam.push({name:n,color:pick});el.value="";pick=COLORS[fam.length%COLORS.length];draw();el.focus();};
    s.querySelector("#famName").addEventListener("keydown",function(e){if(e.key==="Enter")s.querySelector("#famAdd").click();});
    s.querySelector("#linkAdd").onclick=function(){var a=s.querySelector("#lLabel"),u=s.querySelector("#lUrl"),label=a.value.trim(),url=u.value.trim();
      if(!label)return a.focus();if(url&&!/^https?:\/\//i.test(url))url="https://"+url;if(!url)return u.focus();links.push({label:label,url:url});a.value="";u.value="";draw();};
    s.querySelector("#cancel").onclick=closeSheet;
    confirmBtn(s.querySelector("#forget"),function(){lsSet("familyKey","");closeSheet();toast("Avain unohdettu tältä laitteelta");askKey();});
    s.querySelector("#save").onclick=function(){
      lsSet("theme",theme);lsSet("fx",fxPref);applyTheme();
      var lat=parseFloat(String(s.querySelector("#lat").value).replace(",",".")),lon=parseFloat(String(s.querySelector("#lon").value).replace(",","."));
      var value={family:fam,links:links,stops:s.querySelector("#stops").value.trim(),lines:s.querySelector("#lines").value.trim(),stopNames:names,
        bg:s.querySelector("#bg").value.trim(),lat:isFinite(lat)?lat:DEFAULTS.lat,lon:isFinite(lon)?lon:DEFAULTS.lon};
      busy(this,send({op:"settings",value:value}).then(function(){toast("Asetukset tallennettu");S.deps=[];S.busTime=0;loadBus();loadWeather();}));
    };
    draw();drawNames();
  });
}

/* ---------- background photo ---------- */
var bgSrc=null;
function applyBg(){
  var src=S.settings.bg==null?"tausta.jpg":String(S.settings.bg);
  src=src.replace(/["'\\()<>\s]/g,"");
  if(src===bgSrc)return;bgSrc=src;
  var el=$("#bgimg");
  if(!src){el.classList.remove("on");document.body.classList.remove("has-bg");return;}
  var img=new Image();
  img.onload=function(){if(bgSrc!==src)return;el.style.backgroundImage='url("'+src+'")';el.classList.add("on");document.body.classList.add("has-bg");};
  img.onerror=function(){if(bgSrc!==src)return;el.classList.remove("on");document.body.classList.remove("has-bg");};
  img.src=src;
}

/* ---------- weather animation ---------- */
(function(){
  var cv=$("#fx"),ctx=cv.getContext("2d"),W=0,H=0,dpr=1,parts=[],kind="",raf=0,last=0,acc=0,t=0,flash=0,nextFlash=0,wind=0,rgb="70,105,125",glow="255,196,90";
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function pickKind(){
    if(reduce||lsGet("fx","on")==="off")return "";
    var j=S.weather;if(!j||!j.current)return "";
    var c=j.current.weather_code,day=j.current.is_day;
    if(c>=95)return "storm";
    if((c>=71&&c<=77)||c===85||c===86)return "snow";
    if((c>=61&&c<=67)||(c>=80&&c<=82))return "rain";
    if(c>=51&&c<=57)return "drizzle";
    if(c===45||c===48)return "fog";
    if(c===3||(c===2&&day))return "clouds";
    if(c<=2)return day?"sun":"stars";
    return "";
  }
  function rnd(a,b){return a+Math.random()*(b-a);}
  function size(){dpr=Math.min(window.devicePixelRatio||1,1.5);W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  function make(){
    parts=[];var area=W*H,i,n;
    if(kind==="rain"||kind==="storm"){n=Math.round(area/8000);for(i=0;i<n;i++)parts.push({x:rnd(-50,W),y:rnd(-H,H),l:rnd(12,22),v:rnd(9,14),a:rnd(.18,.4)});}
    if(kind==="drizzle"){n=Math.round(area/14000);for(i=0;i<n;i++)parts.push({x:rnd(-50,W),y:rnd(-H,H),l:rnd(6,10),v:rnd(4,6),a:rnd(.15,.3)});}
    if(kind==="snow"){n=Math.round(area/9000);for(i=0;i<n;i++)parts.push({x:rnd(0,W),y:rnd(-H,H),r:rnd(1,3.2),v:rnd(.4,1.2),p:rnd(0,6.28),a:rnd(.35,.8)});}
    if(kind==="stars"){n=Math.round(area/7000);for(i=0;i<n;i++)parts.push({x:rnd(0,W),y:rnd(0,H*.7),r:rnd(.5,1.6),s:rnd(.4,1.4),p:rnd(0,6.28)});}
    if(kind==="clouds"){n=6;for(i=0;i<n;i++)parts.push({x:rnd(-300,W),y:rnd(-40,H*.6),r:rnd(140,260),v:rnd(.08,.2),a:rnd(.06,.12)});}
    if(kind==="fog"){n=5;for(i=0;i<n;i++)parts.push({x:rnd(-W,W),y:rnd(H*.1,H),w:rnd(W*.6,W*1.2),h:rnd(60,140),v:rnd(.1,.3),a:rnd(.06,.12)});}
    if(kind==="sun"){n=14;for(i=0;i<n;i++)parts.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,2.4),v:rnd(.1,.3),p:rnd(0,6.28)});}
  }
  function draw(dt){
    t+=dt;ctx.clearRect(0,0,W,H);
    var k=dt*60,slant=wind*0.35,i,p;
    if(kind==="rain"||kind==="storm"||kind==="drizzle"){
      ctx.lineWidth=kind==="drizzle"?1:1.3;ctx.lineCap="round";
      for(i=0;i<parts.length;i++){p=parts[i];
        p.y+=p.v*k;p.x+=p.v*slant*k;
        if(p.y>H||p.x>W+50){p.y=rnd(-60,-10);p.x=rnd(-80,W);}
        ctx.strokeStyle="rgba("+rgb+","+p.a+")";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.l*slant,p.y-p.l);ctx.stroke();}
      if(kind==="storm"){if(t>nextFlash){flash=.12;nextFlash=t+rnd(9,22);}if(flash>0){ctx.fillStyle="rgba(255,255,255,"+flash+")";ctx.fillRect(0,0,W,H);flash-=dt*.25;}}
    }else if(kind==="snow"){
      for(i=0;i<parts.length;i++){p=parts[i];
        p.y+=p.v*k;p.x+=(Math.sin(t*.8+p.p)*.4+wind*.3)*k;
        if(p.y>H+5){p.y=-5;p.x=rnd(0,W);}if(p.x>W+5)p.x=-5;if(p.x<-5)p.x=W+5;
        ctx.fillStyle="rgba("+rgb+","+p.a+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    }else if(kind==="stars"){
      for(i=0;i<parts.length;i++){p=parts[i];var a=.25+.45*(.5+.5*Math.sin(t*p.s+p.p));
        ctx.fillStyle="rgba("+rgb+","+a+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    }else if(kind==="clouds"||kind==="fog"){
      for(i=0;i<parts.length;i++){p=parts[i];p.x+=p.v*k;
        if(kind==="clouds"){if(p.x-p.r>W){p.x=-p.r;p.y=rnd(-40,H*.6);}
          var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,"rgba("+rgb+","+p.a+")");g.addColorStop(1,"rgba("+rgb+",0)");
          ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.6,p.r,0,0,6.283);ctx.fill();}
        else{if(p.x>W)p.x=-p.w;
          var g2=ctx.createLinearGradient(0,p.y-p.h,0,p.y+p.h);g2.addColorStop(0,"rgba("+rgb+",0)");g2.addColorStop(.5,"rgba("+rgb+","+p.a+")");g2.addColorStop(1,"rgba("+rgb+",0)");
          ctx.fillStyle=g2;ctx.fillRect(p.x,p.y-p.h,p.w,p.h*2);}
      }
    }else if(kind==="sun"){
      var pulse=.5+.5*Math.sin(t*.25),cx=W*.88,cy=H*.05,R=Math.max(W,H)*.55;
      var gs=ctx.createRadialGradient(cx,cy,0,cx,cy,R);gs.addColorStop(0,"rgba("+glow+","+(.22+.06*pulse)+")");gs.addColorStop(1,"rgba("+glow+",0)");
      ctx.fillStyle=gs;ctx.fillRect(0,0,W,H);
      for(i=0;i<parts.length;i++){p=parts[i];p.y-=p.v*k;p.x+=Math.sin(t*.5+p.p)*.2*k;if(p.y<-5){p.y=H+5;p.x=rnd(0,W);}
        ctx.fillStyle="rgba("+glow+","+(.35+.25*Math.sin(t+p.p))+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
    }
  }
  function loop(ts){
    raf=requestAnimationFrame(loop);
    var dt=last?Math.min((ts-last)/1000,.1):0;last=ts;acc+=dt;
    if(acc<1/30)return;          /* about 30 frames per second is enough and spares an old tablet */
    draw(acc);acc=0;
  }
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
  window.fxRestart=function(){
    var cs=getComputedStyle(document.documentElement);
    rgb=(cs.getPropertyValue("--fx-rgb")||"70,105,125").trim();glow=(cs.getPropertyValue("--glow-rgb")||"255,196,90").trim();
    var j=S.weather;wind=j&&j.current?Math.min(j.current.wind_speed_10m||0,15)/15:0;
    var nk=pickKind();stop();size();
    if(nk!==kind||!parts.length){kind=nk;make();}
    ctx.clearRect(0,0,W,H);
    if(kind&&document.visibilityState==="visible")raf=requestAnimationFrame(loop);
  };
  window.addEventListener("resize",function(){if(kind){size();make();}});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")fxRestart();else stop();});
})();

/* ---------- buttons ---------- */
$("#addNote").onclick=function(){noteSheet(null);};
$("#kidAdd").onclick=function(){kidSheet(null);};
$("#kidAll").onclick=function(){kidAllSheet();};
$("#openLists").onclick=function(){openListsApp("");};
/* The lists app runs in a full-screen frame on top of the board and shares its data and family key. */
function openListsApp(hash){
  var ov=$("#listsFrameWrap");
  if(!ov){ov=document.createElement("div");ov.id="listsFrameWrap";ov.className="lists-frame";ov.innerHTML='<iframe title="Listat"></iframe>';document.body.appendChild(ov);}
  ov.querySelector("iframe").src="listat.html?embed=1"+(hash?"#"+hash:"");ov.hidden=false;
}
window.addEventListener("message",function(e){if(e.data&&e.data.type==="close-lists"){var ov=$("#listsFrameWrap");if(ov){ov.hidden=true;ov.querySelector("iframe").src="about:blank";}load();}});
$("#addEvent").onclick=function(){eventSheet(null);};
$("#openSettings").onclick=settingsSheet;
function navStep(n){if(S.view==="month")S.monthOffset+=n;else if(S.view==="day")S.dayOffset+=n;else if(S.view==="next7")S.n7Offset+=n;else S.weekOffset+=n;renderWeek();}
$("#prevWk").onclick=function(){navStep(-1);};
$("#nextWk").onclick=function(){navStep(1);};
$("#thisWk").onclick=function(){S.weekOffset=0;S.monthOffset=0;S.dayOffset=0;S.n7Offset=0;renderWeek();};
/* "7 pv" becomes the default once, also on devices that had the week view selected */
if(lsGet("calView.v2","")!=="1"){lsSet("calView.v2","1");if(lsGet("calView","week")==="week")lsSet("calView","next7");}
S.view=({next7:1,day:1,week:1,month:1})[lsGet("calView","next7")]?lsGet("calView","next7"):"next7";
$("#weather").onclick=function(){wxSheet("hours");};
(function(){var b=document.querySelectorAll(".seg button");for(var i=0;i<b.length;i++)b[i].onclick=function(){S.view=this.dataset.v;lsSet("calView",S.view);renderWeek();};})();

/* kiosk: fullscreen + keep the screen on */
var lock=null;
function wake(){if(!("wakeLock" in navigator)||lock)return Promise.resolve();return navigator.wakeLock.request("screen").then(function(l){lock=l;l.addEventListener("release",function(){lock=null;});}).catch(function(){});}
$("#kiosk").onclick=function(){
  S.kiosk=true;lsSet("kiosk","1");wake();
  var de=document.documentElement;
  if(!document.fullscreenElement&&de.requestFullscreen)de.requestFullscreen().catch(function(){});
  else if(document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen();
};
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){if(S.kiosk)wake();load();loadBus();if(Date.now()-(S.weatherTime||0)>10*60000)loadWeather();}
});
/* any tap re-arms the wake lock (browsers require a gesture) */
document.addEventListener("click",function(){if(S.kiosk)wake();},true);

/* ---------- start ---------- */
applyLayout();applyTheme();applyBg();tick();renderAll();
setInterval(tick,1000);
loadWeather();
if(!configured()){renderFoot();}
else if(!key()){askKey();}
else{load().then(function(){loadBus();loadWeather();if(location.hash==='#listat')listsSheet();});}
if(!configured())loadBus();
setInterval(function(){if(document.visibilityState==="visible")load();},30000);
setInterval(function(){if(document.visibilityState==="visible")loadBus();},30000);
setInterval(function(){if(document.visibilityState==="visible")loadWeather();},15*60000);
})();
