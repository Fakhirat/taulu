<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101816">
<title>Perheen ilmoitustaulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>
/* ===== ASETUKSET – liitä tähän Apps Scriptin verkkosovelluksen osoite ===== */
var BACKEND_URL = "LIITÄ_TÄHÄN_APPS_SCRIPT_OSOITE";
</script>
<style>
/* Layout: wall-board kiosk — clock + weather band, then week | notes | bus departures, quick links as footer. */
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#17302a; --muted:#5d716b; --line:#d5ddd9;
  --accent:#1f6f5c; --accent-ink:#ffffff; --today:#e2efe9; --danger:#a33a2c; --warn:#a86a00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --n1:#f6e39a; --n2:#bfe0d2; --n3:#f3c4b8; --n4:#c9d3f2; --n5:#e3cbec; --n6:#d9e6a8; --note-ink:#1d2622;
  --line-bg:#17302a; --line-ink:#f6e39a;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101816; --panel:#17221f; --ink:#e4ece8; --muted:#93a8a1; --line:#2a3a35;
  --accent:#5cc3a6; --accent-ink:#0c1a16; --today:#1d332c; --danger:#ef8a7a; --warn:#e8b25a;
  --n1:#d9c46e; --n2:#8fc4ad; --n3:#dc9d8e; --n4:#9eaee0; --n5:#c3a2d0; --n6:#b6c97c; --note-ink:#141a18;
  --line-bg:#d9c46e; --line-ink:#141a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:12px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top band */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(48px,6.6vw,96px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:.3em;color:var(--muted);font-weight:500;margin-left:.15em;letter-spacing:0}
.date{display:flex;flex-direction:column;gap:3px;min-width:0}
.date .day{font-family:var(--display);font-weight:500;font-size:clamp(18px,2.2vw,28px)}
.date .week{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.weather{display:flex;align-items:center;gap:12px;padding-left:18px;border-left:1px solid var(--line);min-width:0}
.wnow{display:flex;align-items:center;gap:8px}
.wicon{font-size:40px;line-height:1}
.wtemp{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.wmeta{font-size:13px;color:var(--muted);line-height:1.45}
.wmeta b{color:var(--ink);font-weight:700}
.hours{display:flex;gap:12px}
.hr{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:2px}
.hr .i{font-size:20px}
.hr .tt{color:var(--ink);font-weight:700;font-size:15px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.icon{width:44px;padding:0;justify-content:center}
.btn svg{width:20px;height:20px}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr .85fr;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0}
.ph{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.ph .sp{flex:1}
.nav{border:none;background:none;width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:20px}
.nav:hover{background:var(--today)}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.scroll{overflow:auto;min-height:0;flex:1;padding:0 14px 12px}

.dayrow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 6px;border-top:1px solid var(--line);align-items:start}
.dayrow:first-child{border-top:none}
.dayrow.today{background:var(--today);border-radius:10px;border-top-color:transparent}
.dayrow.today + .dayrow{border-top-color:transparent}
.dayrow.past{opacity:.5}
.dname{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.dnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.evs{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev{display:flex;align-items:baseline;gap:8px;background:none;border:none;text-align:left;padding:3px 0;min-width:0}
.ev .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;font-size:15px}
.ev .x{min-width:0;overflow-wrap:anywhere}
.ev .w{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;background:var(--muted)}
.empty-day{color:var(--muted);font-size:14px}

.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.note{background:var(--n1);color:var(--note-ink);border-radius:4px 4px 14px 4px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;min-height:96px;border:none;text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.note .txt{font-size:17px;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap;flex:1}
.note .who{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;display:flex;justify-content:space-between;gap:6px}

.deps{display:flex;flex-direction:column}
.dep{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.dep:first-child{border-top:none}
.lineno{background:var(--line-bg);color:var(--line-ink);font-family:var(--display);font-weight:700;font-size:17px;min-width:46px;text-align:center;padding:5px 6px;border-radius:8px;font-variant-numeric:tabular-nums}
.dest{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.dest .sname{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.when{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.when .m{font-family:var(--display);font-weight:700;font-size:20px}
.when .c{display:block;font-size:12px;color:var(--muted)}
.when .late{color:var(--warn)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

.empty{color:var(--muted);padding:14px 4px;font-size:15px;line-height:1.45;max-width:36ch;margin:0}
.empty b{color:var(--ink)}

.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot .links{flex:1}
.foot .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.foot a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.foot a svg{width:16px;height:16px;color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.status.bad{color:var(--danger)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,17,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px;width:min(540px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;border-radius:999px;padding:8px 14px;min-height:40px;color:var(--note-ink);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip.none{background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:400}
.chip.none[aria-pressed="true"]{border-color:var(--ink)}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.danger{color:var(--danger);border-color:var(--danger);margin-right:auto}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:8px;min-width:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);line-height:1.4;margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:30;font-size:15px}
[hidden]{display:none!important}

@media (max-width:1100px){ .hours .hr:nth-child(n+4){display:none} .wmeta .sun{display:none} }
@media (max-width:960px){ .hours{display:none} }
@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .weather{border-left:none;padding-left:0;width:100%}
  .actions{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="clock" id="clock">--:--</div>
    <div class="date"><div class="day" id="day"></div><div class="week" id="week"></div></div>
    <div class="weather" id="weather"><span class="wmeta">Haetaan säätä…</span></div>
  </header>

  <main class="main">
    <section class="panel" aria-labelledby="wkH">
      <div class="ph">
        <h2 id="wkH">Viikko</h2><span class="sub" id="wkRange"></span><span class="sp"></span>
        <button class="nav" id="prevWk" type="button" aria-label="Edellinen viikko">&#8249;</button>
        <button class="nav" id="thisWk" type="button" aria-label="Tämä viikko" title="Tämä viikko" style="font-size:12px">&#9679;</button>
        <button class="nav" id="nextWk" type="button" aria-label="Seuraava viikko">&#8250;</button>
      </div>
      <div class="scroll"><div id="days"></div></div>
    </section>
    <section class="panel" aria-labelledby="ntH">
      <div class="ph"><h2 id="ntH">Muistilaput</h2><span class="sp"></span><span class="sub" id="noteCount"></span></div>
      <div class="scroll"><div class="notes" id="notes"></div></div>
    </section>
    <section class="panel" aria-labelledby="busH">
      <div class="ph"><h2 id="busH">Bussit</h2><span class="sp"></span><span class="sub" id="busStamp"></span></div>
      <div class="scroll"><div class="deps" id="deps"></div></div>
    </section>
  </main>

  <footer class="foot"><div class="links" id="foot"></div>
    <div class="actions">
      <button class="btn primary" id="addNote" type="button">+ Lappu</button>
      <button class="btn primary" id="addEvent" type="button">+ Tapahtuma</button>
      <button class="btn icon" id="openSettings" type="button" aria-label="Asetukset" title="Asetukset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="btn icon" id="kiosk" type="button" aria-label="Koko näyttö" title="Koko näyttö, näyttö pysyy päällä">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
function $(s){return document.querySelector(s);}
var COLORS=["n1","n2","n3","n4","n5","n6"];
var DAYS=["ma","ti","ke","to","pe","la","su"];
var DAYS_LONG=["maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai","sunnuntai"];
var MONTHS=["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"];
var DEFAULTS={family:[],links:[],stops:"",lines:"",lat:60.4518,lon:22.2666,place:"Turku"};
var S={notes:[],events:[],settings:clone(DEFAULTS),weekOffset:0,loaded:false,online:true,busProxy:false,deps:[],busErr:"",busTime:0,weather:null};

/* ---------- local storage (per device) ---------- */
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function hm(d){return pad(d.getHours())+"."+pad(d.getMinutes());}
function dow(d){return (d.getDay()+6)%7;}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
function monday(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-dow(d)+off*7);return d;}
function minus(n){return String(n).replace("-","−");}

/* ---------- theme: auto dark 21–7 ---------- */
function applyTheme(){
  var pref=lsGet("theme","auto"),h=new Date().getHours();
  var dark=pref==="dark"||(pref==="auto"&&(h>=21||h<7));
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
}

/* ---------- clock ---------- */
var lastDay="",lastMin=-1;
function tick(){
  var d=new Date();
  $("#clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes())+"<small>"+pad(d.getSeconds())+"</small>";
  var k=ymd(d);
  if(k!==lastDay){lastDay=k;
    $("#day").textContent=cap(DAYS_LONG[dow(d)])+" "+d.getDate()+". "+MONTHS[d.getMonth()];
    $("#week").textContent="Viikko "+isoWeek(d)+" · "+d.getFullYear();
    S.weekOffset=0;renderWeek();renderNotes();
  }
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();applyTheme();renderWeek();renderWeather();}
  if(d.getSeconds()%5===0)renderDeps();
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function member(n){var f=S.settings.family||[];for(var i=0;i<f.length;i++)if(f[i].name===n)return f[i];return null;}
function colorOf(n){var m=member(n);return m?"var(--"+m.color+")":"var(--n1)";}
function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2800);}

/* ---------- backend ---------- */
function configured(){return /^https:\/\/script\.google\.com\//.test(BACKEND_URL);}
function key(){return lsGet("familyKey","");}
function handle(res){
  if(!res||res.ok===false){
    if(res&&res.error==="key"){askKey(true);}
    throw new Error(res&&res.error||"virhe");
  }
  S.notes=res.notes||[];S.events=res.events||[];
  var st=res.settings||{};S.settings=clone(DEFAULTS);for(var k in st)S.settings[k]=st[k];
  S.loaded=true;S.online=true;
  renderAll();
  return res;
}
function load(){
  if(!configured()||!key())return Promise.resolve();
  return fetch(BACKEND_URL+"?key="+encodeURIComponent(key())+"&t="+Date.now())
    .then(function(r){return r.json();}).then(handle)
    .catch(function(e){if(e.message!=="key"){S.online=false;renderFoot();}});
}
function send(body){
  if(!configured()){toast("Taustapalvelun osoite puuttuu index.html-tiedostosta.");return Promise.reject();}
  if(!key()){askKey();return Promise.reject();}
  body.key=key();
  return fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(handle)
    .catch(function(e){toast(e&&e.message==="key"?"Väärä perheen avain.":"Tallennus ei onnistunut. Tarkista nettiyhteys.");throw e;});
}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- render: week ---------- */
function renderWeek(){
  var m=monday(S.weekOffset),today=ymd(new Date()),sun=new Date(m);sun.setDate(m.getDate()+6);
  $("#wkH").textContent="Viikko "+isoWeek(m);
  $("#wkRange").textContent=m.getDate()+"."+(m.getMonth()+1)+".–"+sun.getDate()+"."+(sun.getMonth()+1)+".";
  var box=$("#days");box.innerHTML="";
  for(var i=0;i<7;i++){
    var d=new Date(m);d.setDate(m.getDate()+i);var k=ymd(d);
    var evs=S.events.filter(function(e){return e.date===k;}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99");});
    var row=document.createElement("div");
    row.className="dayrow"+(k===today?" today":"")+(k<today?" past":"");
    row.innerHTML='<div><div class="dname">'+DAYS[i]+'</div><div class="dnum">'+d.getDate()+"."+(d.getMonth()+1)+'.</div></div><div class="evs"></div>';
    var list=row.querySelector(".evs");
    if(!evs.length)list.innerHTML='<span class="empty-day">'+(S.loaded?"–":"")+'</span>';
    evs.forEach(function(e){
      var b=document.createElement("button");b.type="button";b.className="ev";
      b.innerHTML='<span class="dot" style="background:'+(e.who?colorOf(e.who):"var(--muted)")+'"></span><span class="t">'+esc((e.time||"").replace(":","."))+'</span><span class="x">'+esc(e.text)+(e.who?' <span class="w">· '+esc(e.who)+'</span>':"")+'</span>';
      b.onclick=function(){eventSheet(e);};
      list.appendChild(b);
    });
    box.appendChild(row);
  }
  var t=box.querySelector(".today");if(t&&S.weekOffset===0&&!renderWeek._done&&S.loaded){renderWeek._done=true;t.scrollIntoView({block:"nearest"});}
}

/* ---------- render: notes ---------- */
function renderNotes(){
  var box=$("#notes");box.innerHTML="";
  var notes=S.notes.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);});
  $("#noteCount").textContent=notes.length?notes.length+" kpl":"";
  if(!notes.length){

var WMO={0:["Selkeää","☀️","🌙"],1:["Enimmäkseen selkeää","🌤️","🌙"],2:["Puolipilvistä","⛅","☁️"],3:["Pilvistä","☁️","☁️"],45:["Sumua","🌫️"],48:["Huurresumua","🌫️"],
 51:["Heikkoa tihkua","🌦️","🌧️"],53:["Tihkusadetta","🌧️"],55:["Kovaa tihkua","🌧️"],56:["Jäätävää tihkua","🌧️"],57:["Jäätävää tihkua","🌧️"],
 61:["Heikkoa sadetta","🌦️","🌧️"],63:["Sadetta","🌧️"],65:["Kovaa sadetta","🌧️"],66:["Jäätävää sadetta","🌧️"],67:["Jäätävää sadetta","🌧️"],
 71:["Heikkoa lumisadetta","🌨️"],73:["Lumisadetta","🌨️"],75:["Kovaa lumisadetta","❄️"],77:["Lumijyväsiä","🌨️"],
 80:["Sadekuuroja","🌦️","🌧️"],81:["Sadekuuroja","🌧️"],82:["Rankkoja kuuroja","🌧️"],85:["Lumikuuroja","🌨️"],86:["Lumikuuroja","🌨️"],95:["Ukkosta","⛈️"],96:["Ukkosta","⛈️"],99:["Ukkosta","⛈️"]};
function wmo(code,day){var w=WMO[code]||["",""];return {t:w[0],i:(!day&&w[2])?w[2]:w[1]};}
function loadWeather(){
  var s=S.settings;
  var url="https://api.open-meteo.com/v1/forecast?latitude="+s.lat+"&longitude="+s.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day"+
    "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"+
    "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=2";
  fetch(url).then(function(r){return r.json();}).then(function(j){S.weather=j;S.weatherTime=Date.now();renderWeather();})
    .catch(function(){if(!S.weather)$("#weather").innerHTML='<span class="wmeta">Säätietoja ei saatu.</span>';});
}
function renderWeather(){
  var j=S.weather;if(!j||!j.current)return;
  var c=j.current,w=wmo(c.weather_code,c.is_day),dly=j.daily||{};
  var now=new Date(),sunset=dly.sunset&&dly.sunset[0]?new Date(dly.sunset[0]):null,sunrise=dly.sunrise&&dly.sunrise[1]?new Date(dly.sunrise[1]):null;
  var sunTxt=sunset&&now<sunset?"Aurinko laskee "+hm(sunset):(sunrise?"Aurinko nousee "+hm(sunrise):"");
  var hours="",h=j.hourly||{},added=0;
  if(h.time){for(var i=0;i<h.time.length&&added<5;i++){var t=new Date(h.time[i]);if(t<=now||t.getHours()%2)continue;
    var hw=wmo(h.weather_code[i],h.is_day[i]);
    hours+='<div class="hr"><span>'+pad(t.getHours())+'</span><span class="i" title="'+esc(hw.t)+'">'+hw.i+'</span><span class="tt">'+minus(Math.round(h.temperature_2m[i]))+'°</span></div>';added++;}}
  $("#weather").innerHTML='<div class="wnow"><span class="wicon" title="'+esc(w.t)+'">'+w.i+'</span><span class="wtemp">'+minus(Math.round(c.temperature_2m))+'°</span></div>'+
    '<div class="wmeta"><b>'+esc(w.t)+'</b><br>Tuntuu '+minus(Math.round(c.apparent_temperature))+'° · tuuli '+Math.round(c.wind_speed_10m)+' m/s<br>'+
    (dly.temperature_2m_max?"Päivällä "+minus(Math.round(dly.temperature_2m_min[0]))+"…"+minus(Math.round(dly.temperature_2m_max[0]))+"°":"")+(sunTxt?'<span class="sun"> · '+sunTxt+"</span>":"")+'</div>'+
    '<div class="hours">'+hours+'</div>';
}

/* ---------- buses (Föli SIRI) ---------- */
function stopList(){return String(S.settings.stops||"").split(/[,\s]+/).filter(function(x){return /^[A-Za-z0-9]{1,8}$/.test(x);}).slice(0,3);}
function fetchStop(stop){
  function viaProxy(){return fetch(BACKEND_URL+"?action=bus&stop="+encodeURIComponent(stop)+"&key="+encodeURIComponent(key())).then(function(r){return r.json();});}
  if(S.busProxy)return viaProxy();
  return fetch("https://data.foli.fi/siri/sm/"+encodeURIComponent(stop)).then(function(r){return r.json();})
    .catch(function(){if(!configured()||!key())throw new Error("cors");S.busProxy=true;return viaProxy();});
}
function loadBus(){
  var stops=stopList();
  if(!stops.length){S.deps=[];S.busErr="";renderDeps();return;}
  Promise.all(stops.map(function(s){return fetchStop(s).then(function(j){return {stop:s,j:j};});}))
    .then(function(all){
      var lines=String(S.settings.lines||"").split(/[,\s]+/).filter(Boolean).map(function(x){return x.toUpperCase();});
      var deps=[],bad=0;
      all.forEach(function(a){
        if(!a.j||a.j.status!=="OK"||!a.j.result){bad++;return;}
        a.j.result.forEach(function(r){
          if(lines.length&&lines.indexOf(String(r.lineref).toUpperCase())<0)return;
          var exp=r.expecteddeparturetime||r.expectedarrivaltime||r.aimeddeparturetime,aim=r.aimeddeparturetime||r.aimedarrivaltime||exp;
          if(!exp)return;
          deps.push({line:r.lineref,dest:r.destinationdisplay,exp:exp*1000,aim:aim*1000,live:!!r.monitored,stop:a.stop});
        });
      });
      deps.sort(function(a,b){return a.exp-b.exp;});
      S.deps=deps;S.busTime=Date.now();S.busErr=bad===all.length?"Föli ei juuri nyt anna lähtötietoja.":"";renderDeps();
    })
    .catch(function(e){S.busErr=e&&e.message==="cors"?"Bussitiedot vaativat taustapalvelun kytkemisen.":"Bussitietoja ei saatu. Yritetään uudelleen.";renderDeps();});
}
function stopName(s){var m=(S.settings.stopNames||{})[s];return m||("Pysäkki "+s);}
function renderDeps(){
  var box=$("#deps");if(!box)return;
  var stops=stopList(),now=Date.now();
  if(!stops.length){box.innerHTML='<p class="empty">Lisää asetuksissa oman pysäkkisi numero. Sen näkee pysäkkikilvestä tai Fölin reittioppaasta.</p>';$("#busStamp").textContent="";return;}
  var list=S.deps.filter(function(d){return d.exp>now-30000;}).slice(0,8);
  var multi=stops.length>1,html="";
  list.forEach(function(d){
    var min=Math.round((d.exp-now)/60000),late=Math.round((d.exp-d.aim)/60000);
    var m=min<=0?"nyt":(min<=30?min+" min":hm(new Date(d.exp)));
    html+='<div class="dep"><span class="lineno">'+esc(d.line)+'</span><span class="dest">'+(multi?'<span class="sname">'+esc(stopName(d.stop))+'</span>':"")+esc(d.dest||"")+'</span>'+
      '<span class="when"><span class="m">'+(d.live?'<span class="live" title="Reaaliaikainen"></span>':"")+m+'</span><span class="c'+(late>=3?" late":"")+'">'+(min>30?"":hm(new Date(d.exp)))+(late>=3?" (+"+late+")":"")+'</span></span></div>';
  });
  box.innerHTML=html||('<p class="empty">'+(S.busErr||(S.busTime?"Ei lähtöjä lähiaikoina.":"Haetaan lähtöjä…"))+'</p>');
  $("#busStamp").textContent=multi?"":stopName(stops[0]);
}

  else if(document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen();

});

document.addEventListener("click",function(){if(S.kiosk)wake();},true);

applyTheme();tick();renderAll();
setInterval(tick,1000);
loadWeather();
if(!configured()){renderFoot();}

else{load().then(function(){loadBus();loadWeather();});}

setInterval(function(){if(document.visibilityState==="visible")load();},30000);
