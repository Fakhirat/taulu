<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lapsi-tila</title>
<meta name="theme-color" content="#ffd84d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* One bright look on purpose: this page is for a 3-year-old and always looks the same. */
:root{
  color-scheme:light;
  --sky:#bfe8ff;--sky2:#e6f6ff;--sun:#ffd84d;--card:#ffffff;--ink:#2b2a4c;--soft:#6b6a8f;
  --pink:#ff8fb1;--mint:#7fdcb5;--grape:#a98bff;--orange:#ffab5e;--blue:#5fb4ff;
  --done:#38c98b;--line:#e7e4f5;--shadow:0 6px 0 rgba(43,42,76,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:#fff6d6}
body{font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#fff6d6 100%);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:14px;min-width:0}
.hello{flex:1;min-width:0}
.hello h1{margin:0;font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.05;text-wrap:balance}
.hello p{margin:2px 0 0;font-size:clamp(16px,1.9vw,21px);color:var(--soft);font-weight:600}
.stars{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:var(--shadow);font-weight:700;font-size:24px;flex:none}
.stars .st{font-size:30px;display:inline-block}
.stars.pop .st{animation:pop .7s ease}
.gear{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.55);position:relative;flex:none;display:grid;place-items:center;touch-action:none}
.gear svg{width:24px;height:24px;opacity:.5}
.gear .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--grape) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 21px,#000 22px);mask:radial-gradient(circle,transparent 21px,#000 22px)}

.grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.5fr) minmax(0,1.05fr);gap:14px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:14px 16px;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .ic{font-size:24px}
.grow{flex:1}
.scroll{overflow:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* weather */
.wx{background:linear-gradient(160deg,#fff 0%,#fff9e0 100%);cursor:pointer;border:none;text-align:left;width:100%}
.wx.cold{background:linear-gradient(160deg,#fff 0%,#e3f2ff 100%)}
.wxtop{display:flex;align-items:center;gap:10px}
.wxem{font-size:64px;line-height:1;flex:none}
.wxt{font-size:44px;font-weight:700;line-height:1}
.wxt.cold{color:#2f86d6}.wxt.warm{color:#e8742b}
.wxsay{font-size:22px;font-weight:700;line-height:1.15}
.wear{display:flex;flex-wrap:wrap;gap:8px}
.wi{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sky2);border-radius:16px;padding:6px 8px 4px;min-width:64px;flex:1 0 64px;max-width:96px}
.wi .e{font-size:34px;line-height:1.1;height:40px;display:grid;place-items:center}
.wi .e svg{width:38px;height:38px}
.wi span{font-size:13px;font-weight:600;color:var(--soft);text-align:center;line-height:1.1}

/* countdowns */
.cd{display:flex;flex-direction:column;gap:8px}
.cdi{display:flex;align-items:center;gap:10px;border:none;background:#fff4f8;border-radius:18px;padding:8px 10px;text-align:left;width:100%}
.cdi .e{font-size:38px;flex:none}
.cdi b{display:block;font-size:19px;line-height:1.1}
.cdi .n{font-size:15px;color:var(--soft);font-weight:600}
.moons{font-size:14px;letter-spacing:1px;line-height:1.2}
.cdi.today{background:#fff1b8}

/* routine */
.rtabs{display:flex;gap:8px}
.rtab{flex:1;border:none;border-radius:18px;padding:8px 10px;font-size:19px;font-weight:700;background:var(--sky2);color:var(--soft);min-height:48px}
.rtab[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;align-content:start}
.step{position:relative;border:4px solid var(--line);background:#fff;border-radius:24px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:118px;justify-content:center;transition:transform .15s,border-color .2s,background .2s}
.step:active{transform:scale(.95)}
.step .e{font-size:52px;line-height:1.05}
.step .l{font-size:17px;font-weight:600;text-align:center;line-height:1.1}
.step .ck{position:absolute;top:-8px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--done);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.step.done{border-color:var(--done);background:#eafff4}
.step.done .e{filter:saturate(.6);opacity:.75}
.step.done .ck{transform:scale(1)}
.prog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.bar{flex:1;height:18px;border-radius:999px;background:var(--sky2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--done));border-radius:999px;transition:width .4s}
.allok{font-size:20px;font-weight:700;color:var(--done);text-align:center}

/* program + mukaan */
.prog-l{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:10px;border:none;background:#f3efff;border-radius:18px;padding:8px 10px;text-align:left;width:100%}
.pi .e{font-size:36px;flex:none}
.pi b{display:block;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.pi .when{font-size:14px;font-weight:600;color:var(--soft)}
.pi.past{opacity:.5}
.empty{font-size:20px;font-weight:600;color:var(--soft);text-align:center;padding:10px 0}
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pk{border:3px dashed #ffc58f;background:#fff8ef;border-radius:20px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;min-height:92px;justify-content:center}
.pk .e{font-size:38px;line-height:1.1;height:44px;display:grid;place-items:center}
.pk .e svg{width:40px;height:40px}
.pk .l{font-size:14px;font-weight:600;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.pk .ck{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--done);color:#fff;font-size:18px;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.pk.done{border-style:solid;border-color:var(--done);background:#eafff4}
.pk.done .ck{transform:scale(1)}

/* messages, chooser, parent menu */
.msg{display:grid;place-items:center;text-align:center;padding:20px}
.msg .box{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:24px 28px;max-width:520px}
.msg h2{margin:0 0 8px;font-size:26px}
.msg p{margin:0 0 14px;color:var(--soft);font-size:18px;line-height:1.35}
.big{border:none;border-radius:20px;background:var(--sun);font-size:20px;font-weight:700;padding:12px 20px;min-height:52px;text-decoration:none;color:var(--ink);display:inline-block}
.who{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.who button{border:none;border-radius:26px;background:#fff;box-shadow:var(--shadow);padding:16px 24px;font-size:28px;font-weight:700;min-width:150px}
.ov{position:fixed;inset:0;background:rgba(43,42,76,.45);display:grid;place-items:center;z-index:30;padding:16px}
.menu{background:#fff;border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.menu h2{margin:0 0 4px;font-size:22px}
.menu button,.menu a{border:none;border-radius:16px;background:var(--sky2);font-size:19px;font-weight:600;padding:12px 14px;text-align:left;min-height:50px;text-decoration:none;color:var(--ink)}
.menu .main{background:var(--sun);font-weight:700}
.note{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:15px;z-index:40;max-width:calc(100% - 32px)}

/* celebration */
.party{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.party .c{position:absolute;top:-60px;font-size:34px;animation:fall 2.6s ease-in forwards}
.party .bigstar{position:absolute;left:50%;top:50%;font-size:160px;transform:translate(-50%,-50%) scale(0);animation:star 2.4s cubic-bezier(.3,1.5,.5,1) forwards;filter:drop-shadow(0 8px 0 rgba(0,0,0,.08))}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(540deg)}}
@keyframes star{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-50%) scale(1.15)}75%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(160%,-260%) scale(.2);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(20deg)}100%{transform:scale(1)}}
.wiggle{animation:wig .5s ease}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* narrow or portrait screens: one column that scrolls */
@media (max-width:860px),(orientation:portrait){
  .app{height:auto;min-height:100dvh}
  .grid{grid-template-columns:1fr}
  .scroll{overflow:visible}
}
@media (max-height:640px) and (min-width:861px) and (orientation:landscape){
  .app{gap:8px}
  .card{padding:10px 12px;border-radius:22px;gap:8px}
  .wxem{font-size:52px}.wxt{font-size:38px}.wxsay{font-size:20px}
  .step{min-height:104px}.step .e{font-size:46px}
  .hello h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="hello"><h1 id="hi">Hei!</h1><p id="today"></p></div>
    <div class="stars" id="stars" aria-label="Tähdet"><span class="st">⭐</span><span id="starN">0</span></div>
    <button class="gear" id="gear" type="button" aria-label="Aikuisille: pidä pohjassa">
      <span class="ring" id="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="party" id="party" aria-hidden="true"></div>
<div class="note" id="note" hidden></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
var BACKEND=typeof BACKEND_URL==="string"?BACKEND_URL:"";
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function pjson(s){try{var o=typeof s==="string"?JSON.parse(s||"{}"):s;return o&&typeof o==="object"?o:{};}catch(e){return {};}}
function pad(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function pd(k){var p=String(k).split("-");return new Date(+p[0],p[1]-1,+p[2]);}
function dow(d){return (d.getDay()+6)%7;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var DAYS_LONG=["maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai","sunnuntai"];
var MONTHS_P=["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"];
var KM_LIST="kmode",KID_LIST="kids";
var KM_DEF={aamu:[["🚽","Vessa"],["🪥","Hampaat"],["👕","Pukeminen"],["🥣","Aamupala"],["🧥","Ulkovaatteet"]],
  ilta:[["🍎","Iltapala"],["🛁","Pesu"],["🪥","Hampaat"],["🧸","Yöpuku päälle"],["📖","Iltasatu"]]};
var BEANIE='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="8" r="5" fill="#ff8fb1"/><path d="M9 32c0-10 6.7-19 15-19s15 9 15 19z" fill="#ff5d8f"/><path d="M14 24h20M12 28h24" stroke="#ffc2d4" stroke-width="2"/><rect x="6" y="31" width="36" height="9" rx="4.5" fill="#a98bff"/></svg>';

var S={data:null,items:[],events:[],gcal:[],settings:{},weather:null,child:lsGet("lapsi.child",""),routine:"",q:Promise.resolve(),inflight:0,
  sound:lsGet("lapsi.sound","1")==="1",err:""};

/* ---------- sound and speech ---------- */
var VOICE=null;
function pickVoice(){try{VOICE=speechSynthesis.getVoices().filter(function(v){return /^fi/i.test(v.lang);})[0]||null;}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!S.sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fi-FI";if(VOICE)u.voice=VOICE;u.rate=.88;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,t0,d,type,vol){var a=ac();if(!a||!S.sound)return;var o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.18,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);
  o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05);}
function sOn(){tone(784,0,.2);tone(1047,.1,.3);}
function sOff(){tone(520,0,.15,"triangle",.12);}
function sFanfare(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,i*.12,.3,"triangle",.16);});}
function note(t,ms){var n=$("#note");n.textContent=t;n.hidden=false;clearTimeout(note.t);note.t=setTimeout(function(){n.hidden=true;},ms||3500);}

/* keep the screen on while the page is open */
var WL=null;
function wake(){try{if(navigator.wakeLock&&!WL)navigator.wakeLock.request("screen").then(function(l){WL=l;l.addEventListener("release",function(){WL=null;});}).catch(function(){});}catch(e){}}
document.addEventListener("pointerdown",function(){ac();wake();},{passive:true});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){wake();load();}else if(window.speechSynthesis)speechSynthesis.cancel();});

/* ---------- data: same backend and family key as the board ---------- */
function key(){return lsGet("familyKey","");}
function ready(){return /^https:\/\/script\.google\.com\//.test(BACKEND)&&!!key();}
function post(body){body.key=key();return fetch(BACKEND,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
  .then(function(r){return r.text();}).then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error("html");}if(!j||j.ok===false)throw new Error(j&&j.error||"virhe");return j;});}
function apply(res){
  S.items=res.items||[];S.events=res.events||[];S.gcal=Array.isArray(res.gcal)?res.gcal:[];S.settings=res.settings||{};S.lists=res.lists||[];
  try{localStorage.setItem("lapsi.cache",JSON.stringify({t:Date.now(),d:{items:S.items,events:S.events,gcal:S.gcal,settings:S.settings,lists:S.lists}}));}catch(e){}
  S.data=true;
}
function load(){
  if(!ready()||S.inflight)return Promise.resolve();
  return post({op:"get"}).then(function(r){if(!S.inflight){apply(r);S.err="";render();loadWeather();}})
    .catch(function(e){S.err=e&&e.message==="key"?"key":"net";if(!S.data)render();});
}
/* changes show at once and are sent one after another */
function save(row){
  var i=S.items.findIndex(function(x){return x.id===row.id;});if(i<0)S.items.push(row);
  if(!(S.lists||[]).some(function(l){return l.id===row.list;})){
    var l=row.list===KM_LIST?{id:KM_LIST,name:"Lapsi-tila",ts:Date.now(),type:"kmode",data:"{}"}:{id:KID_LIST,name:"Lapsille mukaan",ts:Date.now(),type:"kids",data:"{}"};
    S.lists=(S.lists||[]).concat([l]);queue({op:"upsert",table:"lists",row:l});}
  queue({op:"upsert",table:"items",row:row});
}
function queue(body){
  if(!ready())return;S.inflight++;
  S.q=S.q.then(function(){return post(body).then(function(res){S.inflight--;if(!S.inflight&&res.items){apply(res);render();}})
    .catch(function(){S.inflight=Math.max(0,S.inflight-1);note("Tallennus ei onnistunut. Yritetään myöhemmin uudelleen.");if(!S.inflight)setTimeout(load,4000);});});
}
(function(){try{var c=JSON.parse(localStorage.getItem("lapsi.cache")||"null");if(c&&c.d){S.items=c.d.items||[];S.events=c.d.events||[];S.gcal=c.d.gcal||[];S.settings=c.d.settings||{};S.lists=c.d.lists||[];S.data=true;}}catch(e){}})();

/* ---------- weather (Open-Meteo, same place as the board) ---------- */
function loadWeather(){
  if(S.wxTime&&Date.now()-S.wxTime<20*60000)return;
  var lat=S.settings.lat||60.4518,lon=S.settings.lon||22.2666;
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code,is_day"+
    "&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m&daily=weather_code,snowfall_sum&wind_speed_unit=ms&timezone=Europe%2FHelsinki&forecast_days=2")
    .then(function(r){return r.json();}).then(function(j){S.weather=j;S.wxTime=Date.now();lsSet("lapsi.wx",JSON.stringify(j));render();}).catch(function(){});
}
try{S.weather=JSON.parse(lsGet("lapsi.wx","null"));}catch(e){}
function wxEmoji(c,day){if(c===0||c===1)return day===0?"🌙":"☀️";if(c===2)return "🌤️";if(c===3)return "☁️";if(c===45||c===48)return "🌫️";
  if(c>=71&&c<=77||c===85||c===86)return "❄️";if(c>=95)return "⛈️";if(c>=80)return "🌦️";if(c>=51)return "🌧️";return "🌤️";}
/* the child's outdoor day: morning to afternoon of today, or of tomorrow in the evening */
function kidWeather(){
  var j=S.weather;if(!j||!j.hourly)return null;
  var now=new Date(),evening=now.getHours()>=17,k=ymd(evening?addDays(now,1):now),h=j.hourly,tm=[],pr=0,pp=0,snow=false,wind=0,codes=[];
  for(var i=0;i<h.time.length;i++){if(h.time[i].slice(0,10)!==k)continue;var hr=+h.time[i].slice(11,13);
    if(hr>=7&&hr<=16){tm.push(h.temperature_2m[i]);wind=Math.max(wind,h.wind_speed_10m[i]||0);pr+=h.precipitation[i]||0;pp=Math.max(pp,h.precipitation_probability[i]||0);
      var c=h.weather_code[i];codes.push(c);if((c>=71&&c<=77)||c===85||c===86)snow=true;}}
  if(!tm.length)return null;
  var t=Math.min.apply(null,tm.slice(0,4)),feel=t-(wind>=6?3:wind>=3?1:0),wet=!snow&&pr>=0.5,day=evening?"Huomenna":"Tänään";
  var cur=j.current&&!evening?j.current:null,temp=cur?cur.temperature_2m:t;
  var dom=codes.slice().sort(function(a,b){return b-a;})[0];if(!snow&&!wet&&pp<50)dom=codes[Math.floor(codes.length/2)];
  var em=cur&&!snow&&!wet?wxEmoji(cur.weather_code,cur.is_day):wxEmoji(dom,1);
  var word=feel<=-10?"tosi kylmä":feel<=0?"kylmä":feel<=8?"viileää":feel<=17?"aika lämmin":"lämmin";
  var line=day+" on "+word+"!",extra=snow?"Ulkona on lunta! ❄️":wet?"Ulkona sataa vettä.":pp>=60?"Voi tulla sadetta.":"";
  var wear=[];
  function w(e,l){wear.push([e,l]);}
  if(feel<=-1){w("🧥","Toppatakki");w("👖","Toppahousut");w(BEANIE,"Pipo");w("🧤","Lapaset");if(feel<=-8)w("🧣","Kaulahuivi");}
  else if(feel<=5){w("🧥","Lämmin takki");w(BEANIE,"Pipo");w("🧤","Hanskat");}
  else if(feel<=11){w("🧥","Välikausitakki");w(BEANIE,"Ohut pipo");}
  else if(feel<=17){w("🧥","Kevyt takki");}
  else{w("👕","T-paita");w("🩳","Shortsit");w("🧢","Lippis");}
  if(wet){w("👖","Kurahousut");w("👢","Kumisaappaat");}
  else if(snow){w("🥾","Talvikengät");}
  else if(pp>=60)w("☂️","Sadetakki");
  if(t>=20)w("🧴","Aurinkorasva");
  return {em:em,temp:temp,line:line,extra:extra,wear:wear,cold:feel<=5,warm:feel>=18};
}

/* ---------- picking the child ---------- */
function family(){return Array.isArray(S.settings.family)?S.settings.family:[];}
function kids(){var f=family(),k=f.filter(function(x){return x.kid;});return (k.length?k:f).map(function(x){return x.name;});}
function child(){var ks=kids();if(ks.indexOf(S.child)>=0)return S.child;if(ks.length===1)return ks[0];return "";}

/* ---------- content ---------- */
function rows(list){return S.items.filter(function(i){return i.list===list;}).map(function(i){return {row:i,d:pjson(i.data)};});}
function steps(r){return rows(KM_LIST).filter(function(x){return x.d.kind==="step"&&x.d.routine===r;}).sort(function(a,b){return (a.d.order||0)-(b.d.order||0);});}
function ensureDefaults(){
  if(rows(KM_LIST).some(function(x){return x.d.kind==="step";}))return;
  ["aamu","ilta"].forEach(function(r){KM_DEF[r].forEach(function(s,i){
    var d={kind:"step",routine:r,emoji:s[0],order:i+1};save({id:"km-"+r+"-"+(i+1),list:KM_LIST,text:s[1],done:"",ts:Date.now()+i,data:JSON.stringify(d)});});});
}
function kidOn(d,k){if(d.when==="date")return d.date===k;if(d.when==="weekly")return (d.days||[]).indexOf(dow(pd(k)))>=0&&!(d.skip&&d.skip[k]);return false;}
var ICONS=[[/päiväkoti|pk\b|hoito|tarha|pilke|esikoulu|eskari/i,"🏫"],[/uinti|uima|uimahalli/i,"🏊"],[/mummo|mummi|mummu|mamma|isoäiti/i,"👵"],[/ukki|vaari|pappa|isoisä/i,"👴"],
  [/lääkäri|neuvola|hammaslääk|terveys/i,"🩺"],[/synttär|syntymäp|juhla|🎂/i,"🎂"],[/kerho|muskari|musiikki|laulu/i,"🎵"],[/tanssi|baletti|jumppa|voimistel/i,"💃"],
  [/jalkapallo|futis|pallo/i,"⚽"],[/luistel|jää/i,"⛸️"],[/hiiht|sukset/i,"⛷️"],[/kirjasto|kirja/i,"📚"],[/kauppa|ostok/i,"🛒"],[/kaveri|leikki|vierai/i,"🧸"],
  [/retki|metsä|puisto/i,"🌳"],[/auto|matka|ajo/i,"🚗"],[/juna/i,"🚆"],[/lento|kone/i,"✈️"],[/kampaa|hius|parturi/i,"✂️"],[/sauna/i,"🧖"],[/teatteri|elokuva|leffa|kino/i,"🎭"],
  [/joulu/i,"🎄"],[/pupu|pääsi/i,"🐰"],[/eläin|zoo|hevonen|ratsast/i,"🐴"],[/kylpylä|ranta/i,"🏖️"],[/ruoka|syö|lounas|päivällinen/i,"🍽️"]];
var PACK=[[/kurahousu|sadehousu/i,"👖"],[/kumisaap|saappa/i,"👢"],[/vaihtovaat|vaatteet|paita/i,"👕"],[/sukka/i,"🧦"],[/pipo|myssy/i,BEANIE],[/lapaset|hanska|rukka/i,"🧤"],
  [/juoma|pullo|vesi/i,"🥤"],[/eväs|evää|välipala/i,"🍎"],[/reppu|kassi/i,"🎒"],[/kirja/i,"📖"],[/lelu|nalle|unilelu|pehmo/i,"🧸"],[/uima|uikkari/i,"🩱"],[/pyyhe/i,"🧺"],
  [/kypärä/i,"⛑️"],[/aurinkorasva|rasva|voide/i,"🧴"],[/hammasharja/i,"🪥"],[/tutti/i,"🍼"],[/vaippa/i,"🧷"],[/lippis|hattu/i,"🧢"],[/aurinkolasi/i,"🕶️"],
  [/kengät|kenkä|lenkkar|sisäkenkä/i,"👟"],[/takki/i,"🧥"],[/sukset|hiihto/i,"⛷️"],[/luistimet/i,"⛸️"],[/pallo/i,"⚽"],[/lupa|lappu|paperi|kirje/i,"📄"],[/kuva|valokuva/i,"🖼️"],
  [/kukka|lahja/i,"🎁"],[/sateenvarjo/i,"☂️"],[/lääke/i,"💊"]];
function pick(list,t,def){for(var i=0;i<list.length;i++)if(list[i][0].test(t))return list[i][1];var m=String(t).match(/\p{Extended_Pictographic}/u);return m?m[0]:def;}
function cleanText(t){return String(t).replace(/\p{Extended_Pictographic}️?/gu,"").trim();}

/* ---------- rendering ---------- */
function greet(c){var h=new Date().getHours();var g=h<5?"Hyvää yötä":h<10?"Hyvää huomenta":h<17?"Hei":h<21?"Hyvää iltaa":"Hyvää yötä";return g+(c?", "+c:"")+"!";}
function render(){
  var c=child(),grid=$("#grid"),now=new Date();
  $("#hi").textContent=greet(c);
  $("#today").textContent="Tänään on "+DAYS_LONG[dow(now)]+" "+now.getDate()+". "+MONTHS_P[now.getMonth()];
  $("#starN").textContent=stars();
  if(!/^https:\/\/script\.google\.com\//.test(BACKEND)||!key()){
    grid.innerHTML='<div class="msg" style="grid-column:1/-1"><div class="box"><h2>Lapsi-tila ei ole vielä käytössä</h2><p>Avaa ensin ilmoitustaulu tällä laitteella ja syötä perheen avain. Sen jälkeen lapsi-tila toimii.</p><a class="big" href="index.html">Avaa ilmoitustaulu</a></div></div>';return;}
  if(!S.data){grid.innerHTML='<div class="msg" style="grid-column:1/-1"><div class="box"><h2>'+(S.err?"Ei yhteyttä 😕":"Hetki…")+'</h2><p>'+(S.err==="key"?"Perheen avain ei kelpaa. Avaa ilmoitustaulu ja syötä avain uudelleen.":S.err?"Tarkista nettiyhteys.":"Haetaan päivän juttuja.")+'</p></div></div>';return;}
  if(!c){
    var ks=kids();
    grid.innerHTML='<div class="msg" style="grid-column:1/-1"><div class="box"><h2>Kuka sinä olet?</h2>'+(ks.length?'<div class="who">'+ks.map(function(n){var m=family().filter(function(x){return x.name===n;})[0];
      return '<button type="button" data-who="'+esc(n)+'" style="background:'+esc(m&&m.color||"#fff")+'">'+esc(n)+'</button>';}).join("")+'</div>':'<p>Lisää ilmoitustaulun asetuksiin perheenjäsen ja merkitse hänet lapseksi.</p><a class="big" href="index.html">Avaa ilmoitustaulu</a>')+'</div></div>';
    grid.querySelectorAll("[data-who]").forEach(function(b){b.onclick=function(){S.child=b.dataset.who;lsSet("lapsi.child",S.child);say("Hei "+S.child+"!");render();};});
    return;
  }
  ensureDefaults();
  var h=now.getHours();if(!S.routine||S.routineAuto!==(h<14?"aamu":"ilta")){S.routineAuto=h<14?"aamu":"ilta";S.routine=S.routineAuto;}
  grid.innerHTML='<div class="col"><button type="button" class="card wx" id="wx"></button><div class="card grow scroll" id="cdCard"></div></div>'+
    '<div class="col"><div class="card grow" id="rCard"></div></div>'+
    '<div class="col"><div class="card scroll" id="pCard" style="flex:1 1 50%"></div><div class="card scroll" id="mCard" style="flex:1 1 50%"></div></div>';
  drawWeather();drawCount();drawRoutine();drawProgram();drawPack();
}
function drawWeather(){
  var w=kidWeather(),el=$("#wx");if(!el)return;
  if(!w){el.innerHTML='<h2><span class="ic">🌤️</span>Sää</h2><p class="empty">Haetaan säätä…</p>';el.onclick=null;return;}
  el.classList.toggle("cold",w.cold);
  el.innerHTML='<div class="wxtop"><span class="wxem">'+w.em+'</span><span class="wxt '+(w.cold?"cold":w.warm?"warm":"")+'">'+(Math.round(w.temp)<=0&&Math.round(w.temp)!==0?"−"+Math.abs(Math.round(w.temp)):Math.round(w.temp))+'°</span></div>'+
    '<div class="wxsay">'+esc(w.line)+(w.extra?'<br><span style="font-size:18px;color:var(--soft)">'+esc(w.extra)+'</span>':"")+'</div>'+
    '<div class="wear">'+w.wear.map(function(x){return '<div class="wi"><span class="e">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>';}).join("")+'</div>';
  el.onclick=function(){el.classList.remove("wiggle");void el.offsetWidth;el.classList.add("wiggle");
    say(w.line+" "+(w.extra?cleanText(w.extra)+" ":"")+"Päälle: "+w.wear.map(function(x){return x[1].toLowerCase();}).join(", ")+".");};
}
function drawCount(){
  var el=$("#cdCard");if(!el)return;var t=ymd(new Date());
  var cs=rows(KM_LIST).filter(function(x){return x.d.kind==="count"&&x.d.date>=t;}).sort(function(a,b){return a.d.date.localeCompare(b.d.date);}).slice(0,4);
  if(!cs.length){el.hidden=true;return;}el.hidden=false;
  el.innerHTML='<h2><span class="ic">⏳</span>Odotetaan</h2><div class="cd">'+cs.map(function(x){
    var n=Math.round((pd(x.d.date)-pd(t))/864e5),moons=n>0&&n<=14?'<div class="moons" aria-hidden="true">'+new Array(n+1).join("🌙")+'</div>':"";
    return '<button type="button" class="cdi'+(n===0?" today":"")+'" data-n="'+n+'" data-t="'+esc(cleanText(x.row.text))+'"><span class="e">'+esc(x.d.emoji||"🎉")+'</span><span><b>'+esc(x.row.text)+'</b>'+
      '<span class="n">'+(n===0?"Tänään! 🎉":n===1?"Huomenna! Vielä yksi yö":"Vielä "+n+" yötä")+'</span>'+moons+'</span></button>';}).join("")+'</div>';
  el.querySelectorAll(".cdi").forEach(function(b){b.onclick=function(){var n=+b.dataset.n,tx=b.dataset.t;say(n===0?tx+" on tänään!":n===1?tx+" on huomenna! Enää yksi yö.":tx+": vielä "+n+" yötä.");};});
}
function doneKey(){return ymd(new Date())+"|"+child();}
function drawRoutine(){
  var el=$("#rCard");if(!el)return;var r=S.routine,st=steps(r),k=doneKey();
  var n=st.filter(function(x){return x.d.done&&x.d.done[k];}).length;
  el.innerHTML='<div class="rtabs"><button type="button" class="rtab" data-r="aamu" aria-pressed="'+(r==="aamu")+'">☀️ Aamu</button><button type="button" class="rtab" data-r="ilta" aria-pressed="'+(r==="ilta")+'">🌙 Ilta</button></div>'+
    (st.length?'<div class="steps scroll grow">'+st.map(function(x){var d=x.d.done&&x.d.done[k];
      return '<button type="button" class="step'+(d?" done":"")+'" data-id="'+esc(x.row.id)+'" aria-pressed="'+!!d+'"><span class="ck">✓</span><span class="e">'+esc(x.d.emoji||"⭐")+'</span><span class="l">'+esc(x.row.text)+'</span></button>';}).join("")+'</div>'+
      (n===st.length?'<div class="allok">'+(r==="aamu"?"Aamu tehty! ⭐":"Ilta tehty! Hyvää yötä 🌙")+'</div>':'<div class="prog"><div class="bar"><i style="width:'+Math.round(n/st.length*100)+'%"></i></div><span>'+n+" / "+st.length+'</span></div>')
    :'<p class="empty grow">Ei tehtäviä.</p>');
  el.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){S.routine=b.dataset.r;sOn();say(S.routine==="aamu"?"Aamun tehtävät":"Illan tehtävät");drawRoutine();};});
  el.querySelectorAll(".step").forEach(function(b){b.onclick=function(){
    var x=steps(r).filter(function(y){return y.row.id===b.dataset.id;})[0];if(!x)return;
    var dd=x.d.done||{},on=!dd[k],t=ymd(new Date());Object.keys(dd).forEach(function(kk){if(kk.slice(0,10)<t)delete dd[kk];});
    if(on)dd[k]=1;else delete dd[k];x.d.done=dd;x.row.data=JSON.stringify(x.d);save(x.row);
    if(on){sOn();say(x.row.text+". Hienoa!");}else sOff();
    drawRoutine();
    var all=steps(r),cnt=all.filter(function(y){return y.d.done&&y.d.done[k];}).length;
    if(on&&cnt===all.length)celebrate(r);
  };});
}
/* one star per routine per day; stars also grow flowers in the family tree game on this device */
function stars(){try{var g=JSON.parse(localStorage.getItem("sukupuu.v1")||"null");if(g&&typeof g.stars==="number")return g.stars;}catch(e){}return +lsGet("lapsi.stars","0")||0;}
function addStar(){
  lsSet("lapsi.stars",String((+lsGet("lapsi.stars","0")||0)+1));
  try{var g=JSON.parse(localStorage.getItem("sukupuu.v1")||"null");if(g&&g.people){g.stars=(g.stars||0)+1;localStorage.setItem("sukupuu.v1",JSON.stringify(g));}}catch(e){}
  $("#starN").textContent=stars();var s=$("#stars");s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
}
function celebrate(r){
  var aw={};try{aw=JSON.parse(lsGet("lapsi.awards","{}"))||{};}catch(e){}
  var id=doneKey()+"|"+r,first=!aw[id],t=ymd(new Date());
  Object.keys(aw).forEach(function(x){if(x.slice(0,10)<t)delete aw[x];});
  aw[id]=1;lsSet("lapsi.awards",JSON.stringify(aw));
  var p=$("#party"),html=first?'<div class="bigstar">⭐</div>':"",bits=["🎉","⭐","🌟","🎈","✨","💖","🌈"];
  for(var i=0;i<26;i++)html+='<span class="c" style="left:'+Math.round(Math.random()*96)+'%;animation-delay:'+(Math.random()*.6).toFixed(2)+'s">'+bits[i%bits.length]+'</span>';
  p.innerHTML=html;sFanfare();
  setTimeout(function(){say((r==="aamu"?"Hienoa "+child()+"! Aamun tehtävät on tehty!":"Hienoa "+child()+"! Illan tehtävät on tehty! Hyvää yötä!")+(first?" Sait tähden!":""));},700);
  if(first)setTimeout(addStar,1900);
  setTimeout(function(){p.innerHTML="";},3200);
}
function drawProgram(){
  var el=$("#pCard");if(!el)return;var c=child(),now=new Date(),t=ymd(now),cl=c.toLowerCase(),nowHm=pad(now.getHours())+":"+pad(now.getMinutes());
  var names=family().map(function(x){return x.name.toLowerCase();});
  var ev=S.events.filter(function(e){return e.date===t&&(!e.who||e.who===c);}).map(function(e){return {text:e.text,time:e.time||"",end:e.end||""};})
    .concat(S.gcal.filter(function(e){if(e.date!==t)return false;var tx=String(e.text||"").toLowerCase();return tx.indexOf(cl)>=0||/synttär|syntymäp|🎂/.test(tx)||!names.some(function(n){return n&&tx.indexOf(n)>=0;})&&/mummo|mummi|ukki|vaari|perhe|kaikki|joulu|retki/.test(tx);})
      .map(function(e){return {text:e.text,time:e.time||"",end:e.end||""};}))
    .sort(function(a,b){return a.time.localeCompare(b.time);});
  function part(tm){if(!tm)return "koko päivän";var h=+tm.slice(0,2);return h<10?"aamulla":h<12?"aamupäivällä":h<17?"päivällä":"illalla";}
  el.innerHTML='<h2><span class="ic">📅</span>Tänään</h2>'+(ev.length?'<div class="prog-l">'+ev.map(function(e){
    var past=e.time&&(e.end||e.time)<nowHm&&e.end;
    return '<button type="button" class="pi'+(past?" past":"")+'" data-s="'+esc(cleanText(e.text)+", "+part(e.time)+(e.time?", kello "+(+e.time.slice(0,2))+(e.time.slice(3)!=="00"?"."+e.time.slice(3):""):""))+'"><span class="e">'+pick(ICONS,e.text,"⭐")+'</span><span><b>'+esc(cleanText(e.text)||e.text)+'</b><span class="when">'+part(e.time)+(e.time?" · klo "+e.time.replace(":","."):"")+'</span></span></button>';}).join("")+'</div>'
    :'<p class="empty">Leikitään! 🧸</p>');
  el.querySelectorAll(".pi").forEach(function(b){b.onclick=function(){say(b.dataset.s);};});
}
function drawPack(){
  var el=$("#mCard");if(!el)return;var c=child(),now=new Date(),t=ymd(now),tom=now.getHours()>=14,k=tom?ymd(addDays(now,1)):t;
  var its=rows(KID_LIST).filter(function(x){var w=x.d.who||"";if(w&&w!==c)return false;return kidOn(x.d,k)||(x.d.when==="until"&&!(x.d.doneOn&&x.d.doneOn<t));})
    .sort(function(a,b){return (a.row.ts||0)-(b.row.ts||0);});
  if(!its.length){el.innerHTML='<h2><span class="ic">🎒</span>Mukaan '+(tom?"huomenna":"tänään")+'</h2><p class="empty">Ei mitään erityistä.</p>';return;}
  function isDone(x){return x.d.when==="until"?x.d.doneOn===t:!!(x.d.done&&x.d.done[k]);}
  var left=its.filter(function(x){return !isDone(x);}).length;
  el.innerHTML='<h2><span class="ic">🎒</span>Mukaan '+(tom?"huomenna":"tänään")+(left?"":" ✓")+'</h2><div class="pack">'+its.map(function(x){var d=isDone(x);
    return '<button type="button" class="pk'+(d?" done":"")+'" data-id="'+esc(x.row.id)+'" aria-pressed="'+d+'"><span class="ck">✓</span><span class="e">'+pick(PACK,x.row.text,"🎒")+'</span><span class="l">'+esc(cleanText(x.row.text)||x.row.text)+'</span></button>';}).join("")+'</div>';
  el.querySelectorAll(".pk").forEach(function(b){b.onclick=function(){
    var x=rows(KID_LIST).filter(function(y){return y.row.id===b.dataset.id;})[0];if(!x)return;var on=!isDone(x);
    if(x.d.when==="until")x.d.doneOn=on?t:"";else{x.d.done=x.d.done||{};if(on)x.d.done[k]=1;else delete x.d.done[k];}
    x.row.data=JSON.stringify(x.d);save(x.row);
    if(on){sOn();say(cleanText(x.row.text)+" on mukana!");}else sOff();
    drawPack();
    var ids=its.map(function(y){return y.row.id;});
    if(on&&rows(KID_LIST).filter(function(y){return ids.indexOf(y.row.id)>=0;}).every(isDone))setTimeout(function(){sFanfare();say("Kaikki on pakattu!");},400);
  };});
}

/* ---------- grown-ups: hold the gear to open the menu ---------- */
(function(){
  var g=$("#gear"),ring=$("#ring"),t0=0,raf=0,HOLD=1400;
  function stop(){cancelAnimationFrame(raf);t0=0;ring.style.setProperty("--p",0);}
  function step(){var p=Math.min(1,(performance.now()-t0)/HOLD);ring.style.setProperty("--p",p);if(p>=1){stop();menu();return;}raf=requestAnimationFrame(step);}
  g.addEventListener("pointerdown",function(e){e.preventDefault();t0=performance.now();raf=requestAnimationFrame(step);});
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){g.addEventListener(n,stop);});
  g.addEventListener("contextmenu",function(e){e.preventDefault();});
  g.addEventListener("click",function(){if(!$(".ov"))note("Aikuisille: pidä pohjassa");});
})();
function menu(){
  var ov=document.createElement("div");ov.className="ov";
  var many=kids().length>1;
  ov.innerHTML='<div class="menu" role="dialog" aria-label="Aikuisille"><h2>Aikuisille</h2>'+
    '<a class="main" href="index.html">⬅ Takaisin ilmoitustauluun</a>'+
    (many?'<button type="button" data-m="who">👧 Vaihda lasta ('+esc(child()||"ei valittu")+')</button>':"")+
    '<button type="button" data-m="sound">'+(S.sound?"🔇 Äänet pois":"🔊 Äänet päälle")+'</button>'+
    '<button type="button" data-m="full">⛶ Koko näyttö</button>'+
    '<button type="button" data-m="reload">↻ Päivitä tiedot</button>'+
    '<button type="button" data-m="close">Sulje</button></div>';
  document.body.appendChild(ov);
  function close(){ov.remove();}
  ov.addEventListener("click",function(e){if(e.target===ov)close();});
  ov.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var m=b.dataset.m;close();
    if(m==="who"){S.child="";lsSet("lapsi.child","");render();}
    else if(m==="sound"){S.sound=!S.sound;lsSet("lapsi.sound",S.sound?"1":"0");note(S.sound?"Äänet päällä":"Äänet pois");}
    else if(m==="full"){try{var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}catch(e){}}
    else if(m==="reload"){S.wxTime=0;load().then(function(){note("Päivitetty");});}
  };});
}

render();load();loadWeather();
setInterval(function(){if(!S.inflight)load();loadWeather();},5*60000);
/* redraw each minute so greeting, routine and "tomorrow" switch at the right time */
var lastMin="";setInterval(function(){var d=new Date(),m=d.getHours()+":"+(d.getMinutes()<30?0:1);if(m!==lastMin&&!S.inflight&&!$(".ov")){lastMin=m;render();}},60000);
})();
</script>
