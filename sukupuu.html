<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#bfe6ff">
<title>Minun sukupuuni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<!-- optional: the board's Apps Script address (shared family tree and Drive photos) -->
<script src="config.js"></script>

<style>
/* Layout: one full-screen illustrated tree. Ancestors in the branches, the child at the trunk.
   Games reuse the same tree; a prompt bubble on top, big round buttons at the bottom. Single bright daytime look. */
:root{
  --sky1:#9fd8ff; --sky2:#e9f7ff; --hill:#7cc576; --hill2:#5fae5b; --bark:#8a5a35; --bark2:#a8744a;
  --ink:#24323a; --soft:#5b6b73; --card:#ffffff; --sideA:#ff8a65; --sideB:#5aa9e6; --me:#ffc93c; --pet:#9ccc65;
  --good:#3fb54f; --bad:#ef6c57; --gold:#ffbf1f;
  --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --node:clamp(58px,12vh,116px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky2);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--sideB);outline-offset:3px}
[hidden]{display:none!important}

/* scene */
#scene{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%)}
.sun{position:absolute;right:6%;top:5%;width:12vh;height:12vh;border-radius:50%;background:radial-gradient(circle,#fff6b0 0 45%,#ffe066 46% 100%);box-shadow:0 0 60px 20px rgba(255,224,102,.45)}
.cloud{position:absolute;height:6vh;width:18vh;background:#fff;border-radius:6vh;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:8vh;height:8vh;left:3vh;top:-4vh}
.cloud::after{width:6vh;height:6vh;left:9vh;top:-2.5vh}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%}
#branches{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#deco{position:absolute;inset:0;pointer-events:none}
.flower{position:absolute;font-size:3.2vh;transform:translate(-50%,-50%);animation:pop .5s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}70%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}

/* people */
#nodes{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.4vh;background:none;border:none;padding:0;touch-action:none;transition:transform .2s}
.ph{width:var(--node);height:var(--node);border-radius:50%;background:#fff center/cover no-repeat;border:5px solid #fff;box-shadow:0 0 0 5px var(--ring,var(--sideA)),0 6px 14px rgba(0,0,0,.18);position:relative}
.node.me .ph{width:calc(var(--node)*1.18);height:calc(var(--node)*1.18)}
.nm{background:#fff;border-radius:999px;padding:.3vh 1.2vh;font-weight:600;font-size:clamp(13px,2.4vh,22px);box-shadow:0 2px 6px rgba(0,0,0,.12);white-space:nowrap;max-width:22vw;overflow:hidden;text-overflow:ellipsis}
.node:active{transform:translate(-50%,-50%) scale(.95)}
.node.bounce{animation:bounce .6s}
@keyframes bounce{0%,100%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.25)}60%{transform:translate(-50%,-50%) scale(.95)}}
.node.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 10px),-50%)}75%{transform:translate(calc(-50% + 10px),-50%)}}
.node.glow .ph{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px var(--ring),0 0 0 10px rgba(255,191,31,.0)}50%{box-shadow:0 0 0 5px var(--ring),0 0 0 16px rgba(255,191,31,.75)}}
.node.dim{opacity:.35}
.slot .ph{background:rgba(255,255,255,.55);border:5px dashed #fff;box-shadow:0 0 0 5px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:calc(var(--node)*.42);color:rgba(36,50,58,.35);font-weight:700}
.slot.near .ph{background:rgba(255,236,150,.85)}

/* HUD */
.hud{position:fixed;z-index:5;display:flex;gap:1.5vh;align-items:center}
.hud.tl{left:max(14px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px))}
.hud.tr{right:max(14px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px))}
.jar{display:flex;align-items:center;gap:.8vh;background:rgba(255,255,255,.85);border-radius:999px;padding:.6vh 1.8vh .6vh 1vh;font-weight:700;font-size:clamp(18px,3.4vh,30px);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.jar .s{font-size:1.3em;line-height:1}
.round{width:clamp(52px,9vh,80px);height:clamp(52px,9vh,80px);border-radius:50%;border:none;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:clamp(24px,4.4vh,40px);display:flex;align-items:center;justify-content:center}
.gear{position:relative;opacity:.55;width:clamp(44px,7vh,60px);height:clamp(44px,7vh,60px);font-size:clamp(20px,3.4vh,30px)}
.gear svg.ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
.gear .ring circle{fill:none;stroke:var(--sideB);stroke-width:4;stroke-dasharray:189;stroke-dashoffset:189}
.gear.holding .ring circle{transition:stroke-dashoffset 1.4s linear;stroke-dashoffset:0}
.hint-hold{position:fixed;right:16px;top:calc(12px + 9vh);background:#fff;padding:6px 12px;border-radius:12px;font-size:15px;z-index:6;box-shadow:0 3px 10px rgba(0,0,0,.15)}

.menu{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:2.4vh}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:.4vh;background:none;border:none;padding:0}
.gbtn .b{width:clamp(62px,11vh,100px);height:clamp(62px,11vh,100px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,6vh,54px);box-shadow:0 6px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.15);border:5px solid #fff;transition:transform .15s}
.gbtn:active .b{transform:translateY(4px)}
.gbtn .l{font-weight:700;font-size:clamp(14px,2.4vh,22px);background:rgba(255,255,255,.85);padding:.1vh 1.2vh;border-radius:999px}
.gbtn.g-find .b{background:#ffd54f}.gbtn.g-pick .b{background:#ff8a80}.gbtn.g-build .b{background:#81d4fa}.gbtn.g-riddle .b{background:#ce93d8}

/* prompt */
.prompt{position:fixed;left:50%;transform:translateX(-50%);top:max(12px,env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:1.4vh;background:#fff;border-radius:2.4vh;padding:1vh 1vh 1vh 2.4vh;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:calc(100% - 2 * clamp(64px,24vh,220px));font-weight:700;font-size:clamp(18px,3.8vh,36px)}
.prompt .tx{min-width:0}
.prompt .round{flex:none;width:clamp(46px,8vh,70px);height:clamp(46px,8vh,70px);box-shadow:none;background:#e8f4fd}
.dots{position:fixed;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top,0px)) + clamp(60px,11vh,96px));display:flex;gap:1vh;z-index:6}
.dots i{width:1.8vh;height:1.8vh;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dots i.on{background:var(--gold)}

/* explore card */
.card{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(36,50,58,.35);padding:16px}
.cardin{background:#fff;border-radius:4vh;padding:3vh 4vh;display:flex;gap:4vh;align-items:center;max-width:min(860px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25);animation:pop2 .3s ease-out}
@keyframes pop2{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cardin .big{width:min(38vh,40vw);height:min(38vh,40vw);border-radius:50%;background:#fff center/cover;border:8px solid #fff;box-shadow:0 0 0 8px var(--ring),0 8px 20px rgba(0,0,0,.2);flex:none}
.cardin h2{margin:0;font-size:clamp(26px,6vh,56px);line-height:1.05}
.cardin p{margin:1.2vh 0 0;font-size:clamp(16px,3vh,28px);color:var(--soft);font-weight:500;line-height:1.3}
.cardin .row{display:flex;gap:1.6vh;margin-top:2.4vh}

/* pick game */
.pick{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:4vh;padding:16vh 16px 6vh;background:rgba(233,247,255,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pc{background:#fff;border:none;border-radius:4vh;padding:2vh;display:flex;flex-direction:column;align-items:center;gap:1.4vh;box-shadow:0 8px 0 rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.12);transition:transform .2s}
.pc .big{width:min(30vh,24vw);height:min(30vh,24vw);border-radius:50%;background:#fff center/cover;border:6px solid #fff;box-shadow:0 0 0 6px var(--ring)}
.pc .nm2{font-weight:600;font-size:clamp(16px,2.8vh,26px);color:var(--soft)}
.pc.good{transform:scale(1.1);box-shadow:0 0 0 8px var(--good),0 10px 24px rgba(0,0,0,.12)}
.pc.bad{animation:shake2 .45s}
@keyframes shake2{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.pc.out{opacity:.25;pointer-events:none}

/* build game tray */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:2vh;background:rgba(255,255,255,.75);border-radius:999px;padding:1.2vh 2.4vh;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.piece{width:var(--node);height:var(--node);border-radius:50%;background:#fff center/cover;border:5px solid #fff;box-shadow:0 0 0 5px var(--ring),0 6px 12px rgba(0,0,0,.2);touch-action:none;cursor:grab}
.piece.drag{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 0 5px var(--ring),0 16px 28px rgba(0,0,0,.3)}
.piece.ghost{opacity:.25}
.piece.back{transition:left .3s ease,top .3s ease}

/* celebration */
.party{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;background:rgba(255,255,255,.55)}
.party .bigstar{font-size:16vh;line-height:1;animation:spin 1.2s ease-out}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.party .pbox{background:#fff;border-radius:4vh;padding:3vh 5vh;display:flex;flex-direction:column;align-items:center;gap:2.4vh;box-shadow:0 12px 40px rgba(0,0,0,.2);text-align:center;max-width:min(720px,92vw)}
.party h2{margin:0;font-size:clamp(28px,7vh,60px);line-height:1.1}
.party p{margin:0;font-size:clamp(16px,3vh,26px);color:var(--soft);font-weight:500}
.party .round{width:clamp(70px,13vh,110px);height:clamp(70px,13vh,110px);font-size:clamp(34px,6.5vh,56px)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:26;pointer-events:none}
.flystar{position:fixed;z-index:27;font-size:6vh;pointer-events:none;transition:left .7s cubic-bezier(.5,-.3,.6,1),top .7s cubic-bezier(.5,-.3,.6,1),transform .7s;transform:translate(-50%,-50%) scale(1.4)}

/* parent editor */
.edit{position:fixed;inset:0;z-index:40;background:#f4f8fa;overflow:auto;-webkit-user-select:text;user-select:text}
.edit .in{max-width:900px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.ehead{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#f4f8fa;padding:10px 0;z-index:2}
.ehead h1{flex:1;margin:0;font-size:26px}
.btn{border:2px solid #d4e0e6;background:#fff;border-radius:999px;padding:10px 18px;min-height:46px;font-weight:600;font-size:16px}
.btn.primary{background:var(--sideB);border-color:var(--sideB);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c3ba}
.note{background:#fff7d6;border-radius:14px;padding:12px 16px;line-height:1.45;font-size:16px}
.grp{background:#fff;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.grp h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:8px}
.grp h2 i{width:14px;height:14px;border-radius:50%;display:inline-block}
.per{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border-top:1px solid #e6eef2;padding-top:10px}
.per:first-of-type{border-top:none;padding-top:0}
.pthumb{width:84px;height:84px;border-radius:50%;background:#eee center/cover;border:4px solid #fff;box-shadow:0 0 0 4px var(--ring);position:relative;padding:0}
.pthumb span{position:absolute;right:-6px;bottom:-6px;background:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;min-width:0}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft);font-weight:600;min-width:0}
.pf input,.pf select{font:inherit;font-size:16px;font-weight:500;color:var(--ink);border:2px solid #dbe5ea;border-radius:10px;padding:8px 10px;min-height:44px;background:#fbfdfe;width:100%}
.pf .wide{grid-column:1 / -1}
.prow{display:flex;gap:8px;flex-wrap:wrap;grid-column:1 / -1}
.small{font-size:14px;padding:6px 12px;min-height:38px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:16px}
.example{position:fixed;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top,0px));z-index:4;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-size:clamp(12px,2vh,16px);color:var(--soft);font-weight:600}
.ph,.big,.piece,.pthumb{background-position:center 30%!important}
.chooser{position:fixed;inset:0;z-index:45;background:rgba(36,50,58,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.chin{background:#fff;border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chhead{display:flex;align-items:center;gap:10px}.chhead h2{flex:1;margin:0;font-size:22px}
.chsub{margin:0;color:var(--soft);font-size:15px;line-height:1.4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pg{aspect-ratio:1;border-radius:14px;border:4px solid transparent;background:#eef3f6 center/cover no-repeat;position:relative;padding:0;overflow:hidden}
.pg span{position:absolute;left:4px;right:4px;bottom:4px;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.ok span{display:none}
.pg.err::after{content:"⚠️";position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pg.sel{border-color:var(--sideB)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene">
  <div class="sun"></div>
  <div class="cloud" style="top:9%;animation-duration:95s;animation-delay:-30s"></div>
  <div class="cloud" style="top:20%;animation-duration:140s;animation-delay:-90s;transform:scale(.7)"></div>
  <svg id="ground" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 C 200 60, 380 90, 520 100 S 820 60, 1000 110 L1000 300 L0 300 Z" fill="var(--hill)"/>
    <path d="M0 190 C 240 150, 420 200, 600 180 S 880 160, 1000 190 L1000 300 L0 300 Z" fill="var(--hill2)"/>
  </svg>
  <div id="deco"></div>
  <svg id="branches" aria-hidden="true"></svg>
  <div id="nodes"></div>
</div>

<div class="hud tl" id="hudL">
  <button class="round" id="homeBtn" type="button" aria-label="Takaisin puuhun" hidden>🏠</button>
  <div class="jar" id="jar" aria-label="Tähdet"><span class="s">⭐</span><span id="starN">0</span></div>
</div>
<div class="hud tr">
  <button class="round gear" id="gear" type="button" aria-label="Vanhempien asetukset: pidä painettuna">⚙️<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/></svg></button>
</div>
<div class="hint-hold" id="holdHint" hidden>Pidä painettuna</div>

<div class="menu" id="menu">
  <button class="gbtn g-find" type="button" data-game="find"><span class="b">🔍</span><span class="l">Etsi</span></button>
  <button class="gbtn g-pick" type="button" data-game="pick"><span class="b">🃏</span><span class="l">Valitse</span></button>
  <button class="gbtn g-build" type="button" data-game="build"><span class="b">🧩</span><span class="l">Rakenna</span></button>
  <button class="gbtn g-riddle" type="button" data-game="riddle"><span class="b">🤔</span><span class="l">Arvoitus</span></button>
</div>
<div class="example" id="exampleBadge" hidden>Esimerkkiperhe · vaihda omat kuvat ja nimet asetuksista ⚙️</div>

<div class="prompt" id="prompt" hidden><span class="tx" id="promptTx"></span><button class="round" id="sayAgain" type="button" aria-label="Kuuntele uudestaan">🔊</button></div>
<div class="dots" id="dots" hidden></div>
<div class="pick" id="pick" hidden></div>
<div class="tray" id="tray" hidden></div>
<div class="card" id="card" hidden></div>
<div class="party" id="party" hidden></div>
<canvas id="fx"></canvas>
<div class="edit" id="edit" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickOne(a){return a[rnd(a.length)];}
/* lower-case only kinship words ("Mummo" -> "mummo"), never names ("Nöpö-kissa" stays) */
var KIN=/^(äiti|isä|äiskä|iskä|mummo|mummi|mummu|mumma|mamma|ukki|vaari|pappa|isoäiti|isoisä|eno|täti|setä|veli|sisko|sisar|sisarus|serkku|kummi|kissa|koira|pikkuveli|pikkusisko|isoveli|isosisko|vauva)(?=$|[\s\-.,!?])/i;
function lc(s){s=String(s||"");return KIN.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;}

/* =========================================================
   Family data (kept only in this device's browser)
   ========================================================= */
var KEY="sukupuu.v1";
function exampleFamily(){
  return {v:1,example:true,stars:0,sound:true,levels:{find:1,pick:1,build:1,riddle:1},people:[
    {id:"me",role:"me",name:"Lumi",call:"Lumi",fact:"",photo:""},
    {id:"pa",role:"parent",side:"a",name:"Laura",call:"Äiti",gen:"äidin",fact:"Äiti tykkää laulaa.",photo:""},
    {id:"pb",role:"parent",side:"b",name:"Antti",call:"Isä",gen:"isän",fact:"Isä osaa tehdä lettuja.",photo:""},
    {id:"ga1",role:"grand",side:"a",rel:"äiti",name:"Ritva",call:"Mummo",fact:"Mummo leipoo mustikkapiirakkaa.",photo:""},
    {id:"ga2",role:"grand",side:"a",rel:"isä",name:"Kalevi",call:"Ukki",fact:"Ukilla on vene.",photo:""},
    {id:"gb1",role:"grand",side:"b",rel:"äiti",name:"Sirkka",call:"Mummi",fact:"Mummilla on kissa.",photo:""},
    {id:"gb2",role:"grand",side:"b",rel:"isä",name:"Heikki",call:"Vaari",fact:"Vaari kasvattaa mansikoita.",photo:""},
    {id:"ua1",role:"psib",side:"a",rel:"veli",name:"Ville",call:"Eno Ville",fact:"",photo:""},
    {id:"ub1",role:"psib",side:"b",rel:"sisko",name:"Kaisa",call:"Täti Kaisa",fact:"",photo:""},
    {id:"pet1",role:"pet",name:"Nöpö",call:"Nöpö-kissa",emoji:"🐱",fact:"Nöpö nukkuu sohvalla.",photo:""}

function nextPick(){

function bindPiece(pc){
  var drag=null;
  pc.addEventListener("pointerdown",function(e){
    e.preventDefault();ac();
    var p=byId(pc.dataset.id),r=pc.getBoundingClientRect();
    drag={p:p,el:pc.cloneNode(true),sx:e.clientX,sy:e.clientY,moved:false,home:{x:r.left+r.width/2,y:r.top+r.height/2}};
    drag.el.classList.add("drag");drag.el.style.left=drag.home.x+"px";drag.el.style.top=drag.home.y+"px";document.body.appendChild(drag.el);
    pc.classList.add("ghost");
    try{pc.setPointerCapture(e.pointerId);}catch(err){}
  });
  pc.addEventListener("pointermove",function(e){
    if(!drag)return;
    if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>8)drag.moved=true;
    drag.el.style.left=e.clientX+"px";drag.el.style.top=e.clientY+"px";
    var s=nearestSlot(e.clientX,e.clientY);$$(".slot").forEach(function(n){n.classList.toggle("near",!!s&&n.dataset.id===s.id);});
  });
  function end(e){
    if(!drag)return;var d=drag;drag=null;
    $$(".slot").forEach(function(n){n.classList.remove("near");});
    if(!d.moved){d.el.remove();pc.classList.remove("ghost");say("Tämä on "+lc(d.p.call)+". Mihin "+lc(d.p.call)+" kuuluu?");return;}
    var s=nearestSlot(e.clientX,e.clientY),r=VIEW.round;
    if(s&&s.id===d.p.id){
      VIEW.slots[s.id].filled=true;d.el.remove();pc.remove();sGood();r.done++;
      drawTree();var el=nodeEl(s.id);anim(el,"bounce");giveStar(el);dots(r.n,r.done);
      say(pickOne(PRAISE)+" "+d.p.call+" on tässä.");
      if(r.done>=r.n)finish("build");
    }else{
      if(s){sBad();r.misses++;r.fails[d.p.id]=(r.fails[d.p.id]||0)+1;say("Ei ihan. Tämä on "+lc(d.p.call)+". Kokeile toista paikkaa.");
        if(r.fails[d.p.id]>=2){var c=nodeEl(d.p.id);if(c){c.classList.add("glow");setTimeout(function(){c.classList.remove("glow");},2500);}}}
      d.el.classList.add("back");d.el.style.left=d.home.x+"px";d.el.style.top=d.home.y+"px";
      setTimeout(function(){d.el.remove();pc.classList.remove("ghost");},320);
    }
  }
  pc.addEventListener("pointerup",end);pc.addEventListener("pointercancel",end);
}
function nearestSlot(x,y){
  var best=null,bd=1e9,lim=Math.max(70,Math.min(innerWidth,innerHeight)*.13);
  $$(".slot").forEach(function(n){var r=n.querySelector(".ph").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(cx-x,cy-y);if(d<bd){bd=d;best=n;}});
  return best&&bd<lim?{id:best.dataset.id}:null;
}

function squareJpeg(src,size){

    var s=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement("canvas");c.width=c.height=size;
    c.getContext("2d").drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/3,s,s,0,0,size,size);res(c.toDataURL("image/jpeg",.82));};
    im.onerror=function(){rej(new Error("img"));};im.src=src;});

function loadPhoto(id,size){

    return squareJpeg(u,400).then(function(sq){PHOTOS[id]=sq;savePhotos();scheduleRedraw();return sq;});
  });

function sharedPeople(){return P().map(function(p){var o={};["id","role","side","rel","name","call","gen","fact","emoji","drive"].forEach(function(k){if(p[k]!=null&&p[k]!=="")o[k]=p[k];});return o;});}
var pushT=null;
function schedulePush(){if(!syncReady()||FAM.example)return;FAM.ts=Date.now();save();clearTimeout(pushT);pushT=setTimeout(pushTree,1500);}
function pushTree(){
  clearTimeout(pushT);
  if(!syncReady()||FAM.example)return Promise.resolve();
  SYNC.state="saving";syncUi();
  /* device-only photos are uploaded first so the other devices can see them too */
  var chain=Promise.resolve();
  P().filter(function(p){return p.photo&&!p.drive;}).forEach(function(p){
    chain=chain.then(function(){return api({op:"treePhoto",image:p.photo}).then(function(j){p.drive=j.id;PHOTOS[j.id]=p.photo;delete p.photo;savePhotos();save();});});});
  return chain.then(function(){return api({op:"treeSave",value:{people:sharedPeople(),ts:FAM.ts||Date.now()}});})
    .then(function(j){SYNC.folder=!!j.folder;SYNC.state="ok";syncUi();})
    .catch(function(e){SYNC.state="error";SYNC.msg=errText(e);syncUi();});
}
function pullTree(){
  if(!syncReady()||!$("#edit").hidden||VIEW.mode!=="home")return Promise.resolve();
  return api({op:"tree"}).then(function(j){
    SYNC.folder=!!j.folder;var t=j.tree;
    if(t&&Array.isArray(t.people)&&t.people.length){
      if(FAM.example||!FAM.ts||Number(t.ts)>FAM.ts){
        var local={};P().forEach(function(p){if(p.photo&&!p.drive)local[p.id]=p.photo;});
        FAM.people=t.people.map(function(p){if(!p.drive&&local[p.id])p.photo=local[p.id];return p;});
        FAM.ts=Number(t.ts)||Date.now();FAM.example=false;save();avatarCache={};refreshAll();
      }else if(FAM.ts>Number(t.ts))pushTree();
    }else if(!FAM.example)pushTree();
    SYNC.state="ok";syncUi();
  }).catch(function(e){SYNC.state="error";SYNC.msg=errText(e);syncUi();});
}
function syncUi(){
  var el=$("#syncSt");if(!el)return;
  el.textContent=SYNC.state==="saving"?"Tallennetaan…":SYNC.state==="error"?SYNC.msg:SYNC.state==="ok"?"✓ Tallessa":"";
  el.style.color=SYNC.state==="error"?"var(--bad)":"var(--soft)";
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pullTree();});

/* photo chooser: Drive folder grid + camera/gallery */
function openChooser(pid){
  var p=byId(pid);if(!p)return;
  var drive=syncReady(),ov=document.createElement("div");ov.className="chooser";
  ov.innerHTML='<div class="chin"><div class="chhead"><h2>Kuva: '+esc(p.call||p.name||"")+'</h2><button class="btn" type="button" data-x="close">Sulje</button></div>'+
    (drive?'<p class="chsub" id="chSub">Haetaan kuvia Drivesta…</p><div class="pgrid" id="pgrid"></div>':'<p class="chsub">Driven kuvat ovat käytössä, kun yhteinen tallennus on päällä.</p>')+
    '<div class="prow"><button class="btn'+(drive?"":" primary")+'" type="button" data-x="device">📷 Ota kuva tai valitse laitteelta</button>'+((p.photo||p.drive)?'<button class="btn danger" type="button" data-x="remove">Poista kuva</button>':"")+'</div></div>';
  $("#edit").appendChild(ov);
  function close(){ov.remove();}
  ov.addEventListener("click",function(e){if(e.target===ov)close();});
  $('[data-x="close"]',ov).onclick=close;
  $('[data-x="device"]',ov).onclick=function(){close();photoFor=pid;$("#fileIn").value="";$("#fileIn").click();};
  var rm=$('[data-x="remove"]',ov);if(rm)rm.onclick=function(){delete p.photo;delete p.drive;FAM.example=false;save();schedulePush();close();avatarCache={};drawEditor();};
  if(!drive)return;
  var sub=$("#chSub",ov),grid=$("#pgrid",ov);
  api({op:"photos"}).then(function(j){
    if(!ov.isConnected)return;
    sub.textContent=j.files.length?'Kansio "'+j.folder+'" · '+j.files.length+' kuvaa · napauta oikeaa':'Kansio "'+j.folder+'" on vielä tyhjä. Lisää kuvia Driveen tähän kansioon ja avaa tämä uudelleen.';
    grid.innerHTML=j.files.map(function(f){return '<button type="button" class="pg'+(p.drive===f.id?" sel":"")+'" data-id="'+esc(f.id)+'" aria-label="'+esc(f.name)+'"><span>'+esc(f.name)+'</span></button>';}).join("");
    var btns=$$(".pg",grid),i=0,active=0;
    (function next(){while(active<4&&i<btns.length){(function(b){active++;
      loadPhoto(b.dataset.id,"s").then(function(u){b.style.backgroundImage="url('"+u+"')";b.classList.add("ok");},function(){b.classList.add("err");})
        .then(function(){active--;if(ov.isConnected)next();});})(btns[i++]);}})();
    btns.forEach(function(b){b.onclick=function(){
      btns.forEach(function(x){x.classList.toggle("sel",x===b);});sub.textContent="Ladataan kuvaa…";
      loadPhoto(b.dataset.id,"l").then(function(){p.drive=b.dataset.id;delete p.photo;FAM.example=false;save();schedulePush();close();avatarCache={};drawEditor();toast("Kuva valittu");},
        function(e){sub.textContent="Kuvaa ei saatu ladattua. "+errText(e);});
    };});
  }).catch(function(e){
    if(!ov.isConnected)return;
    var m=e&&e.message;
    sub.textContent=m==="nofolder"?"Kuvakansiota ei ole vielä asetettu. Liitä kansion osoite Code.gs:n kohtaan SUKUPUU_KANSIO ja tee uusi versio.":
      m==="folder"?"Kuvakansiota ei löytynyt. Tarkista kansion osoite Code.gs:ssä.":m==="op"?"Code.gs on vanha versio. Päivitä se, niin Driven kuvat toimivat.":"Driven kuvia ei saatu. "+errText(e);
  });
}
function syncSectionHtml(){
  if(!SYNC_ON)return '<div class="grp"><h2>Tallennus</h2><p style="margin:0;color:var(--soft)">Sukupuu on tallessa vain tällä laitteella. Kun sivu on samassa GitHub-osoitteessa kuin ilmoitustaulu (config.js), sukupuu ja Driven kuvat voidaan jakaa kaikille laitteille.</p></div>';
  if(!famKey())return '<div class="grp"><h2>Yhteinen sukupuu</h2><p style="margin:0;color:var(--soft)">Syötä perheen avain (sama kuin ilmoitustaululla), niin sukupuu näkyy kaikilla laitteilla ja kuvat voi valita Drivesta.</p><div class="pf"><label>Perheen avain<input id="keyIn" type="password" autocomplete="current-password"></label></div><div class="prow"><button class="btn primary small" type="button" id="keyGo">Ota käyttöön</button></div></div>';
  return '<div class="grp"><h2>☁️ Yhteinen sukupuu</h2><p style="margin:0;color:var(--soft)">Henkilöt ja kuvat tallentuvat perheen Google-taulukkoon ja näkyvät kaikilla laitteilla. Tähdet ja vaikeustasot ovat laitekohtaisia. <span id="syncSt"></span></p>'+
    (SYNC.folder?"":'<p class="note" style="margin:0">Kuvakansiota ei ole vielä asetettu: liitä Drive-kansion osoite Code.gs:n kohtaan <b>SUKUPUU_KANSIO</b>.</p>')+'</div>';
}

load();setMode("home");pullTree();
/* keep the screen awake while playing, where the browser allows it */
var lock=null;function wake(){if("wakeLock" in navigator&&!lock)navigator.wakeLock.request("screen").then(function(l){lock=l;l.addEventListener("release",function(){lock=null;});}).catch(function(){});}
document.addEventListener("pointerdown",wake,{once:false,passive:true});
document.addEventListener("visibilitychange",function(){if(document.visibilityState!=="visible"&&window.speechSynthesis)speechSynthesis.cancel();});
})();
</script>
